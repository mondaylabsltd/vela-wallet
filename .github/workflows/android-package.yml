# Release build of the Android shell (app-android/vela-wallet): an UNSIGNED
# release APK and AAB, kept as a workflow artifact on an `android-v*` tag.
#
# NOT attached to a GitHub Release, by ruling (spec 063 §0): the phone apps ship
# through the stores, which are paid, and a free installable package next to a
# paid listing is the project undercutting its own price by accident. It was
# also never installable — an unsigned APK is refused by the package installer
# ("package info is null"), which is how this was found.
#
# What the tag still buys, and why the workflow stays:
#   * the file the founder signs and uploads to Play — the artifact below; and
#   * the check that the RELEASE configuration still compiles. Nothing else
#     builds `assembleRelease`/`bundleRelease` with the three-ABI core, and a
#     packaging path nobody walks is where 0.9.0 found three defects at once.
#
# Unsigned on purpose (founder, 2026-09-11: 不用考虑签名). The upload keystore
# is the founder's to hold; signing the AAB is a local step
# (`jarsigner` / Play App Signing — see docs/project-takeover/05).
#
# Unlike the `android` job in ci.yml this job does NOT pass
# -PvelaSkipRustBuild: a release package needs libvela_core_uniffi.so for all
# three ABIs, so the Rust core is cross-compiled here (cargo-ndk, ~6 minutes
# cold, cached by rust-cache after that).
name: Android package

on:
  # Cutting an Android build: `git tag android-v1.0 && git push origin android-v1.0`
  # — one tag per push; several tags in one push trigger nothing (spec 063 FR-007).
  # The tag's version must equal `versionName` in app/build.gradle.kts.
  push:
    tags: ['android-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'app-android/vela-wallet/app/build.gradle.kts'
      - 'rust/scripts/build-android.sh'
      - '.github/workflows/android-package.yml'

permissions:
  contents: read

jobs:
  metadata:
    name: Validate the packaging metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: versionName / versionCode / applicationId are set
        run: |
          f=app-android/vela-wallet/app/build.gradle.kts
          for k in versionName versionCode applicationId; do
            grep -qE "^\s*$k = " "$f" || { echo "::error::$f no longer sets $k"; exit 1; }
          done
          grep -qE 'abiFilters \+= listOf\("arm64-v8a", "armeabi-v7a", "x86_64"\)' "$f" \
            || { echo "::error::the packaged ABI list changed — update rust/scripts/build-android.sh and this workflow together"; exit 1; }
      - name: A release tag must name versionName
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app-android/vela-wallet/app/build.gradle.kts)
          tag="${GITHUB_REF_NAME#android-v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $tag but build.gradle.kts says versionName $version — bump it and re-tag"
            exit 1
          fi

  package:
    name: Build the unsigned APK and AAB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@v4
      # rust/scripts/build-android.sh drives cargo-ndk and finds the NDK under
      # $ANDROID_SDK_ROOT/ndk/ (the runner image ships one; the script picks
      # the newest).
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # A fresh checkout cannot build this app: rust/bindings/kotlin/ is
      # gitignored and consumed in place as a kotlin.srcDir.
      - name: Generate the Kotlin bindings
        working-directory: rust
        run: |
          cargo build --release -p vela-core-uniffi
          cargo run --release -p vela-core-uniffi --bin uniffi-bindgen -- generate \
            --library target/release/libvela_core_uniffi.so \
            --language kotlin --out-dir bindings/kotlin --no-format
      - name: Build (release, unsigned; cross-compiles the core for 3 ABIs)
        working-directory: app-android/vela-wallet
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain
      - name: Collect
        id: collect
        working-directory: app-android/vela-wallet
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk "out/vela-wallet-android-${version}-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/vela-wallet-android-${version}-unsigned.aab"
          ls -l out
      - name: Checksums travel with the packages
        working-directory: app-android/vela-wallet/out
        run: |
          sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS-android"
          mv "$RUNNER_TEMP/SHA256SUMS-android" SHA256SUMS-android
          cat SHA256SUMS-android
      # The artifact IS the deliverable: download it from the run, sign, submit.
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app-android/vela-wallet/out/*
          if-no-files-found: error
