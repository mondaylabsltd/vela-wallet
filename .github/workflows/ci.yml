# CI gate — mirrors the local checks documented in
# docs/project-takeover/02-local-development.md.
#
# Shape of the repository (since spec 039, 2026-09-11): one shared Rust core
# (`rust/`) and four shells — app-web, app-desktop, app-ios, app-android —
# each with its own toolchain and its own job below. The React Native / Expo
# app that used to live under `src/` is gone; nothing in this file runs
# Expo, Metro, Jest or a root TypeScript check any more.
#
# The `app` job is the TOOLING gate: the generators and the corpus oracles
# that every shell depends on (identicon and i18n vectors replayed against
# the pinned npm packages, the regenerated artefacts diffed against what is
# committed, the Lottie and reachability lints, the parity gates, and the
# Expo-residue check). The
# npm package that installs the oracles lives in `scripts/` — the repository
# root carries no npm state (founder ruling, spec 039). The job keeps the
# name `app` because branch protection requires a check called that; what it
# runs is what is listed here.
#
# Deployment coupling: the web wallet deploys from Cloudflare's own build of
# app-web/vela-wallet (Workers app `vela-wallet-web`), which runs independently
# of this workflow — a CF build failure shows in the CF dashboard, NOT here
# (CI green ≠ deployed). The `web` job runs the same `bun run build`, so a broken
# build fails the PR instead of surfacing only after merge.
#
# Deliberately NOT included (they run in nightly.yml — nightly, and on demand
# with `gh workflow run nightly.yml` — non-blocking until each has a
# proven-stable record on a runner; see docs/ci/test-loops.md):
#   - app-web's Playwright e2e (`bun run test:e2e`) on chromium, firefox, webkit
#     — all but one spec: `e2e/extension-site-start.e2e.ts` runs in `web`
#     (r12, a regression three rounds running);
#   - the trusted-signer page suites (app-web/trusted-signer/samples);
#   - the multisig fork suite (web onchain + vela-core's multisig_fork);
#   - Android macrobenchmarks, iOS PerfTests, the desktop perf harness.
# Not anywhere in CI:
#   - the desktop gallery sweep (`sweep-gallery.sh`): opens real windows.
# Elsewhere:
#   - app-web/getvela.app: separate bun/SvelteKit project, own job below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Everything on any branch, the iOS UI suite included:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

# Every Linux job names its image. `ubuntu-latest` moved to 26.04 under us and
# Playwright refused to install Chromium there: an unpinned image is a gate that
# can turn red without a commit.
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact, not "22": `gen-i18n.mjs` extracts the day-period and weekday
          # tables (`datetime_data.rs`) from Node's own ICU, and this job checks
          # that they still regenerate byte for byte. A floating 22.x moved the
          # runner to 22.23 (ICU 78.3), whose Korean AM/PM differ from the
          # committed ICU 78.2 table, and the check failed on every PR. Bump
          # this together with a regeneration on the same Node.
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # The tooling package (i18next, identicons-esm, @noble/*) — scripts/,
      # not the root.
      # The release gate's version rule (spec 066) — here so that it is exercised
      # on every PR, on the same OS the gate runs on: the script asks `date` what
      # month it is, and GNU date and BSD date do not share a syntax. release.yml
      # only ever runs on a release branch, which is too late to learn that.
      - name: The release version rule passes its own tests
        run: scripts/check-release-version.test.sh
      - run: npm ci --prefix scripts
      # Half of this gate retired with the TypeScript oracle it compared against.
      #
      # primitives/abi/eip712/safe/webauthn.json were extracted from the
      # quarantined TS implementations. Those are deleted — the Rust core is the
      # only implementation now — so those vectors are FROZEN goldens with no
      # generator: still replayed through Rust, the Kotlin and Swift bindings and
      # the shipped web artifact, but no longer re-derivable. Changing one is a
      # deliberate act that must be argued in the PR, not a regenerate-and-commit.
      #
      # identicon*.json and i18n*.json keep their oracles (the identicons-esm and
      # i18next packages, pinned in package-lock), so they keep this gate: an
      # unnoticed dependency bump that redrew every avatar or moved a plural rule
      # would otherwise pass a fully green suite, because the corpus regenerates
      # with it. The dump is byte-stable — no timestamp, no git sha.
      - name: Regenerable corpus still matches its npm oracles
        run: |
          npm --prefix scripts run dump:vectors
          git diff --exit-code -- rust/crates/vela-core/tests/vectors/identicon.json \
                                  rust/crates/vela-core/tests/vectors/identicon-bulk.json \
                                  rust/crates/vela-core/tests/vectors/i18n-behaviour.json \
                                  rust/crates/vela-core/tests/vectors/i18n-exhaustive.json \
                                  rust/crates/vela-core/tests/vectors/i18n-plural.json \
                                  rust/crates/vela-core/tests/vectors/i18n-plural-legacy.json \
            || { echo "::error::The identicon/i18n vectors no longer match the packages they were extracted from — identicons-esm or i18next moved under us. Treat a redrawn avatar or a changed plural as a release blocker, not a chore: review the diff and confirm the bump was intended."; exit 1; }
      # The identicon artwork table is GENERATED from the pinned identicons-esm
      # package (specs/003-rust-identicon FR-009). Regenerating and requiring a
      # zero diff is what catches the dependency drifting away from the avatars
      # users already have — a bump that silently redrew every account would
      # otherwise pass a fully green suite, since the corpus regenerates too.
      - name: Identicon artwork table matches the pinned package
        run: |
          node scripts/gen-identicon-features.mjs
          git diff --exit-code -- rust/crates/vela-core/src/identicon_features.rs \
            || { echo "::error::The identicon artwork no longer matches identicons-esm. Every existing account's avatar would change. Treat as a release blocker, not a chore: review the diff and confirm the dependency bump was intended."; exit 1; }
      # The i18n corpus lives in the crate and is THE source of truth (spec
      # 004-rust-i18n FR-010). Every downstream artefact — the shared Rust path
      # table, the fifteen compiled-in catalogs, the datetime data, and the
      # per-locale JSON under assets/i18n that app-ios, app-android and app-web
      # all read — is generated from it. Regenerating and requiring a zero diff
      # is what stops them drifting apart: an edit committed to the corpus
      # without regenerating would leave a shell rendering the old string while
      # the Rust suite rendered the new one, and both would be green.
      - name: i18n artefacts match the corpus
        run: |
          node scripts/gen-i18n.mjs
          git diff --exit-code -- rust/crates/vela-core/src/i18n/paths.rs \
                                  rust/crates/vela-core/src/i18n_catalogs \
                                  rust/crates/vela-core/src/l10n/datetime_data.rs \
                                  assets/i18n \
            || { echo "::error::The generated i18n artefacts no longer match rust/crates/vela-core/i18n/locales. Run 'npm --prefix scripts run gen:i18n' and commit the result TOGETHER WITH the corpus change — a corpus edit and its regenerated artefacts belong in one commit."; exit 1; }
      # Reports the six known corpus defects (FR-018) and fails only on NEW ones.
      # It fixes nothing on purpose: silently "improving" a translated string during
      # an engine port makes every parity claim unverifiable.
      - name: i18n corpus defect register
        run: node scripts/lint-i18n-corpus.mjs
      # Four apps render these animations with THREE different engines (spec
      # 012). They agree on the core of the Lottie format and diverge, silently
      # and differently from each other, at its edges — so the assets are pinned
      # to the subset where they agree, plus the cross-file invariants that only
      # exist because one animation ships in four framings.
      #
      # The self-test is not optional decoration. This linter is one naive
      # `x`-key search away from rejecting every legal file in the repo (the
      # bezier ease handles look exactly like expressions), and one filter away
      # from letting a broken crop hide the ratio drift it caused. Both were
      # real, both were caught by fixtures, and the fixtures are what keep them
      # caught.
      - name: Launch animation assets are legal
        run: |
          node scripts/lint-lottie-assets.mjs --self-test
          node scripts/lint-lottie-assets.mjs
      # Every screen family a native client ships must be reachable from that
      # client's navigation root. Spec 022 shipped 9,695 lines of drawn UI across
      # three clients that no person could open, and every gate here stayed green
      # — because on each platform the COMPILER was happy: rustc never reads a
      # directory nobody declared, and Kotlin/Swift happily compile a screen
      # nothing routes to. Only navigation can see it.
      #
      # Static on purpose: no cargo, no gradle, no xcodebuild, well under a
      # second. A guard that needs a 25-minute toolchain is a guard somebody
      # eventually skips — which is the failure mode it exists to prevent.
      - name: Native screens are reachable
        run: node scripts/check-native-reachability.mjs
      # The sibling question, and the one spec 081 FR-001 was: a screen can be
      # reachable, compile, and still tell the core nothing, because the event
      # it sends names fields the core does not have. Serde rejects the value
      # and the machine never runs — silently, with every type-string parity
      # ruler still green. This reads the payload against the generated types.
      # Static too: no toolchain, well under a second.
      - name: Shell events carry the fields the core declares
        run: node scripts/check-event-payloads.mjs
      # The third one in the family: a control that is drawn, has a hit area,
      # and calls the no-op its handler defaults to. A device run found one on
      # the Add Network results; sweeping all four shells for the shape found
      # twenty. This catches the half that is decidable — a handler no live
      # call site passes at all — and its header says plainly what it misses,
      # including the row that prompted it.
      - name: No control is drawn with a handler nobody passes
        run: node scripts/check-dead-controls.mjs
      # Byte-parity between the Rust core and the JS library the app still ships on
      # native — over every address literal in the repo plus 200k random seeds.
      - name: Identicon parity (Rust core vs the shipped JS library)
        run: node scripts/verify-identicon-parity.mjs
      # Byte-parity between the Rust i18n engine and the i18next the app still
      # ships — the full 17,115 (locale, key) cross-product plus 50,000 fuzzed
      # option bundles. The fuzz is the point: the committed corpus proves the port
      # matches on inputs someone thought of, and this pass has already caught one
      # it did not (a non-finite `count` losing its value crossing the wasm
      # boundary, because JSON has no syntax for Infinity).
      - name: i18n parity (Rust core vs the shipped JS library)
        run: node scripts/verify-i18n-parity.mjs
      # Spec 039 retired the React Native / Expo tree. This keeps it retired:
      # a deleted path reappearing, an Expo/RN dependency in any package.json,
      # an Expo term in a workflow step or npm script, or one of the old
      # root-only Expo/EAS/`build:web` commands quoted in a living document
      # all fail; prose mentions are only counted. The self-test runs first
      # for the same reason the Lottie linter's does.
      - name: No Expo residue
        run: |
          node scripts/check-expo-residue.mjs --self-test
          node scripts/check-expo-residue.mjs
      # Native parity T1: the cross-platform scenario manifest. Every test it
      # names — per scenario, per platform — must exist under that name, and a
      # test the manifest says runs in a required suite must not carry a skip
      # marker. A rename that orphans an entry fails here; the gaps it records
      # are printed, not failed (they are the backlog, not a regression).
      - name: Scenario manifest names real tests
        run: |
          node scripts/ci/check-scenarios.mjs --self-test
          node scripts/ci/check-scenarios.mjs --summary "$GITHUB_STEP_SUMMARY"
      # R23: every code path, symbol, advisory id and KNOWN-BUGS id cited in
      # docs/SECURITY-MODEL.md, docs/security/hardening.md,
      # docs/security/review-pack.md and docs/security/verify.md names
      # something in this tree. A rename
      # that orphans a citation fails here, so the security docs cannot drift
      # from the code without someone noticing. It proves a citation exists,
      # not that it supports its sentence.
      - name: Security docs cite code that exists
        run: |
          node scripts/ci/check-doc-claims.mjs --self-test
          node scripts/ci/check-doc-claims.mjs
      # §38: the vendored PeerConnect client is the bytes VENDOR.json records
      # (the rebuild from its commit is `supply-chain`'s).
      - name: The vendored PeerConnect client is what VENDOR.json records
        run: node scripts/check-peerconnect-vendor.mjs

  # The web wallet: app-web/vela-wallet (SvelteKit → Cloudflare Workers).
  #
  # Bun installs from bun.lock with an isolated linker. Node still executes
  # the build and test tools; changing the package manager does not change
  # the application runtime.
  #
  # `bun run build` is not just vite: it re-checks the generated design tokens
  # against docs/design-tokens.json and regenerates the Worker types, then
  # prerenders every locale page by running the vela-core wasm i18n engine in
  # Node. So this job also fails on a token drift or a corpus/artifact mismatch
  # that only shows up at build time.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-web/vela-wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # The browser's copy of the core wasm is gitignored (sync-wasm.mjs says
      # why), and `bun run check` runs `sync-wasm --check` — which, on a fresh
      # checkout, can only say "missing". Copy it first; the check then
      # proves the copy matches rust/pkg-web, which is its job.
      - name: Put the committed core wasm where the browser fetches it
        run: bun run sync:wasm
      - name: Check (tokens, wasm copy, generated core types, svelte-check)
        run: bun run check
      - name: Lint (prettier + eslint)
        run: bun run lint
      - name: Build (tokens drift + worker types + prerender all locales)
        run: bun run build
      # Both extension packages (spec 027; Safari 2026-10). The vitest suites
      # below read them — `src/lib/extension/package.test.ts` and
      # `safari-package.test.ts` assert on the built manifests and pages — so
      # they are built before the tests, not after.
      - name: Build the Chrome extension
        run: bun run build:extension
      - name: Build the Safari extension
        run: bun run build:extension:safari
      # vitest's `client` project runs in a real Chromium (vitest-browser-playwright).
      - name: Install Chromium for the browser tests
        run: bun run playwright install --with-deps chromium
      # Both projects: `server` (node) and `client` (Chromium). The JUnit file
      # lets the next step prove the shared core vectors were replayed, not
      # skipped.
      - name: Unit tests (vitest server + client)
        run: bun run vitest run --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/vitest-junit.xml"
      - name: The shared core vectors were replayed, none skipped
        working-directory: .
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          node scripts/ci/assert-test-results.mjs --platform web --junit "$RUNNER_TEMP/vitest-junit.xml"
      # r12: a new site starts where the account lives — regressed three
      # rounds running (r9, r10, r12), so its e2e gates every PR instead of
      # waiting for the nightly. The real Chrome extension (built above),
      # headless (`--headless=new`, no display): an account funded on Arc
      # Testnet after the wallet last read it, a slow node, the side panel;
      # it reproduces r12's "Network Sepolia" without the fix. The site is
      # the extension's own pages plus a local dApp, so the preview here is
      # only the config's web server, started from the bundle built above
      # rather than built a second time.
      #
      # §35 (review 1-1), moved here from the nightly (final review): the
      # served wallet's security headers — on a prerendered page and on a
      # Worker response, a hash-based page CSP, and the wallet booting its
      # core under that CSP with no violation (`e2e/security-headers.e2e.ts`,
      # three tests, a few seconds) — against the same preview.
      - name: The extension starts a new site where the account lives, and the served headers (e2e, required)
        run: |
          node e2e/preview.mjs 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 90); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 1; done
          bun run playwright test --project=chromium e2e/extension-site-start.e2e.ts e2e/security-headers.e2e.ts --reporter=list
      - name: Keep the preview's log
        if: failure()
        run: cat "$RUNNER_TEMP/preview.log" || true

  # The marketing site + API worker, moved under app-web/ with the rest of the
  # web surfaces (2026-08-12). It deploys by hand (`bun run deploy`), so nothing
  # outside this path needed updating — but the runbook command changed with it.
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-web/getvela.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Svelte check
        run: bun run check
      # The site's unit tests block the PR (final review): among them the
      # served security surface — `.well-known/assetlinks.json` (release
      # fingerprints only, VELA-2026-003), `apple-app-site-association`,
      # `security.txt`, and the `_headers` block pinned to
      # src/lib/security-headers.ts. Both vitest projects: `server` (node) and
      # `client` (Chromium, vitest-browser-playwright).
      - name: Install Chromium for the browser tests
        run: bunx playwright install --with-deps chromium
      - name: Unit tests (vitest server + client)
        run: bunx vitest run

  # ---------------------------------------------------------------------------
  # §38 (Round 22, review 1-10 and 1-9): the supply chain and the two things
  # this repository ships as built bytes — the signing page and the web core.
  # Every step here runs the same on a laptop (docs/security/verify.md).
  # NOTE (founder action): add `supply-chain`, `signing-page` and
  # `web-core-reproducible` to the branch-protection required checks, or a
  # red one merges.
  # ---------------------------------------------------------------------------

  # Dependency hygiene. cargo-deny over both Rust graphs (advisories,
  # licences, sources, bans — reasons for every exception in deny.toml), the
  # JS audits of what ships, and the vendored PeerConnect client rebuilt from
  # its recorded commit and compared byte for byte.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      # An exact version, its download checked against the release's own
      # sha256 by the action; no container.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,wasm-bindgen@0.2.129
      - name: cargo deny — the core and its bindings (rust/)
        run: cargo deny --manifest-path rust/Cargo.toml --config deny.toml check
      - name: cargo deny — the desktop app (gpui, its own lockfile)
        run: cargo deny --manifest-path app-desktop/vela-wallet/Cargo.toml --config deny.toml check
      - name: cargo deny — the Windows passkey crate
        run: cargo deny --manifest-path app-desktop/vela-passkey-win/Cargo.toml --config deny.toml check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # `--prod` is what a browser runs that is a runtime dependency; SvelteKit
      # bundles its devDependencies into the shipped pages too, so the whole
      # tree is also held to `critical`. A finding with no fix is allowlisted
      # in the app's own config with its reason — none today.
      - name: bun audit — the web wallet (prod high, all critical)
        working-directory: app-web/vela-wallet
        run: |
          bun audit --prod --audit-level=high
          bun audit --audit-level=critical
      - name: bun audit — getvela.app (prod high)
        working-directory: app-web/getvela.app
        run: bun audit --prod --audit-level=high
      - name: npm audit — the tooling package (high)
        run: npm audit --prefix scripts --audit-level=high
      - name: The vendored PeerConnect client rebuilds from its recorded commit
        env:
          VELA_PEERCONNECT_OUT: ${{ runner.temp }}/peerconnect
        run: node scripts/check-peerconnect-vendor.mjs --rebuild
      # When they differ, what CI built is what to read.
      - name: Keep the PeerConnect rebuild
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerconnect-rebuild
          path: ${{ runner.temp }}/peerconnect
          retention-days: 14

  # The signing page is published as built bytes (`dist/b/<sha256>/sign.html`),
  # and every wallet trusts a page only by those hashes. `--check` fails when
  # these sources build a page that is not committed, when a published path
  # does not hash to its name, when the index or `_headers` or `sw.js` drifted,
  # and when two builds of the same sources disagree — under Bun (the page's
  # runtime) and Node alike, because a hash only one runtime reproduces
  # verifies nothing. Blocking on every PR (review 1-9).
  signing-page:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-web/trusted-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: build-single --check (Bun)
        run: bun samples/build-single.mjs --check
      - name: build-single --check (Node)
        run: node samples/build-single.mjs --check

  # The web core (`assets/wasm/vela_core_bg.*.wasm` + `rust/pkg-web`) is a
  # committed build. This rebuilds it from a clean export of the commit in the
  # pinned container (rust/scripts/web-build.Dockerfile: rustc 1.97.1,
  # wasm-pack 0.15.0, wasm-bindgen 0.2.126, binaryen 117, node 22.22.3) and
  # compares the bytes: the committed module IS what this commit builds, or
  # this fails. On main the CI-built module is also attested (GitHub build
  # provenance), so anyone can check that wallet.getvela.app serves bytes this
  # repository built (docs/security/verify.md).
  web-core-reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write      # the short-lived identity that signs the attestation
      attestations: write  # record it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild in the pinned container and compare byte for byte
        env:
          VELA_KEEP: '1'
          VELA_REPRO_OUT: ${{ runner.temp }}/repro
        run: rust/scripts/reproduce-web.sh "$GITHUB_SHA"
      # When they differ, the bytes CI built are what to read (and, if the
      # host build was the one that moved, what to commit).
      - name: Keep what the container built
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-core-container-build
          path: |
            ${{ runner.temp }}/repro/tree/assets/wasm
            ${{ runner.temp }}/repro/tree/rust/pkg-web
            ${{ runner.temp }}/repro/build.log
          retention-days: 14
      - name: Attest the CI-built web core
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/repro/tree/assets/wasm/vela_core_bg.*.wasm
            ${{ runner.temp }}/repro/tree/rust/pkg-web/vela_core.js

  # vela-core shared Rust library (specs/001-rust-core-bindings).
  # NOTE (founder action): add BOTH `rust` and `rust-macos` to branch-protection
  # required checks so they gate merges like `app` and `site` do. `rust-macos` is
  # the only job that exercises the Swift bindings — without it in the required
  # set, an iOS-side FFI divergence merges green.
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      # The three features, on for the LINT and the TEST steps alike:
      #
      #   - `dev-fixtures`: the parallel space's software signer (spec 032) is
      #     compiled by no shipping crate, so this is the one place its golden
      #     addresses are locked and its bytes are checked against the real
      #     authenticator parsers. The wasm canary below deliberately does not
      #     enable it.
      #   - `i18n-all`: REQUIRED, not a nicety. vela-core's default feature set
      #     is empty, so the compiled-in catalogs are absent and 1,516 of the
      #     3,554 conformance cases fail with `I18nCatalogUnavailable`.
      #   - `crux`: every machine (onboarding, multisig, signing…) and the
      #     tests that drive them (`tests/app_*.rs`, `multisig_fork.rs`'s
      #     compile). vela-core-uniffi happens to turn it on through feature
      #     unification today; named here so a `-p vela-core` run, or a
      #     workspace that stops unifying it, cannot silently drop the machine
      #     suites from the gate.
      #
      # One list for both steps, so the linted code is the tested code.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features "$VELA_CORE_FEATURES" -- -D warnings
        env:
          VELA_CORE_FEATURES: vela-core/i18n-all,vela-core/dev-fixtures,vela-core/crux
      - name: Tests (conformance corpus + proptests + machines)
        run: cargo test --workspace --features "$VELA_CORE_FEATURES"
        env:
          VELA_CORE_FEATURES: vela-core/i18n-all,vela-core/dev-fixtures,vela-core/crux
      - name: Wasm build (getrandom canary)
        run: cargo build --target wasm32-unknown-unknown -p vela-core-wasm
      # The Windows passkey path. It cannot be built by any job that builds the
      # desktop APP — that tree compiles C and needs a mingw toolchain — so it
      # lives in its own crate with no C in it, and this is the only thing
      # standing between a Windows-only file and nobody ever compiling it.
      #
      # Know what this gate does NOT cover: it checks the crate STANDALONE, so
      # it says nothing about how the desktop app depends on it. That blind spot
      # cost us once — the dependency sat inside
      # `[target.'cfg(target_os = "macos")'.dependencies]` under a comment
      # claiming it was unconditional, so the entire Windows path went unlinked
      # while this job stayed green. Only a real Windows build finds that class
      # of bug, and desktop-windows-packages runs on a release (release.yml) or by dispatch, not on PRs.
      - name: Windows passkey path (type-check only)
        run: ../app-desktop/vela-wallet/scripts/check-windows.sh
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Web build is current (rust/pkg-web committed and matching)
        working-directory: .
        run: node rust/scripts/build-web.mjs --check
      - name: Conformance corpus through the shipped web artifact
        working-directory: .
        run: node rust/scripts/verify-web.mjs
      # The onboarding Core<->Shell boundary is JSON, so nothing but this gate
      # keeps ~40 wire variants honest between Rust and TypeScript. A drifted
      # variant fails at RUNTIME, in a branch the e2e suites do not reach
      # (incompatible provider, non-discoverable credential) — see
      # specs/011-crux-onboarding-state/research.md D8.
      - name: Onboarding wire types are current (app-web/vela-wallet/src/lib/onboarding/generated)
        working-directory: .
        run: node rust/scripts/gen-onboarding-types.mjs --check
      - name: Swift bindings generate (compiled here, exercised in rust-macos)
        run: |
          cargo build --release -p vela-core-uniffi
          cargo run --release -p vela-uniffi-bindgen --bin uniffi-bindgen -- generate \
            --library target/release/libvela_core_uniffi.so --language swift --out-dir /tmp/ubind
          test -s /tmp/ubind/vela_core_uniffi.swift
      - name: Set up JDK (for the Kotlin corpus harness)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Kotlin
        run: |
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Conformance corpus through the Kotlin bindings
        run: ./scripts/smoke-kotlin.sh

  # Swift half of the SC-001 cross-platform check — its own job because the
  # Swift toolchain needs a macOS runner, and keeping it separate leaves the
  # linux gate fast.
  rust-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Conformance corpus through the Swift bindings
        run: ./scripts/smoke-swift.sh

  # ---------------------------------------------------------------------------
  # The three native clients (spec 029).
  #
  # Until this feature nothing in CI built any of them. The only `app-desktop`
  # reference in this file was `check-windows.sh`, which type-checks a DIFFERENT,
  # C-free crate standalone — and whose own header records having missed exactly
  # this class of bug once before ("left the Windows path unlinked, with this
  # gate green throughout"). The desktop app crate is also not a member of the
  # `rust/` workspace, so `cargo test --workspace` cannot reach it.
  #
  # What that cost: 9,695 lines of drawn, translated, fixture-complete UI shipped
  # on three clients that no person could open, and every gate here stayed green.
  #
  # These three jobs are the compile half. The reachability half is static and
  # runs in `app` above, because a screen nothing routes to still COMPILES on all
  # three platforms — only navigation can see that, and only a toolchain-free
  # check is cheap enough to never be skipped.
  # ---------------------------------------------------------------------------

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-desktop/vela-wallet
    steps:
      # Checkout FIRST. Every `run` in this job inherits the working-directory
      # above, and a step that runs before the checkout has no directory to
      # start bash in — the job died on step 2 with "No such file or directory"
      # and never reached a single line of Rust. apt does not care where it is
      # run from, so the fix is the order, not an override.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the gpui build dependencies
        # Lifted from desktop-linux-packages.yml minus the packaging tools. The
        # app cannot be cross-checked (its tree compiles ThorVG, resvg and
        # hidapi C), so this is a native Linux build, not a `--target` check.
        #
        # libdbus-1-dev is not gpui's: BLE (the caBLE passkey channel) goes
        # through btleplug, and on Linux that is BlueZ, and BlueZ is a D-Bus
        # service — so libdbus-sys' build script wants dbus-1.pc. It has been
        # missing since the list was written; nothing noticed, because the job
        # never got as far as compiling.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config \
            git ca-certificates curl file \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig-dev libasound2-dev libssl-dev libzstd-dev \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app-desktop/vela-wallet
          # gpui and gpui_platform are git dependencies on the whole Zed
          # repository; without caching, every run re-clones it.
          cache-all-crates: true
      - name: Format
        run: cargo fmt --all --check
      # The lockfile is the one a release builds from: a PR that changes a
      # dependency without committing Cargo.lock fails here, not on the
      # release branch. desktop-windows below runs the same on Windows.
      - name: Check (lockfile honoured)
        run: cargo check --all-targets --locked
      # NOT `-D warnings`, and the reason is recorded rather than hidden: the
      # BASELINE carries ten clippy warnings in caBLE/Noise transport code
      # (7 in src/ctap/cable.rs, 1 in cable/l2cap.rs, 1 in hardware.rs, 1 in
      # onboarding.rs), because nothing has ever run clippy on this crate. Fixing
      # transport code is not spec 029's business (AI-CODING-RULES §2), and a
      # gate that starts red is a gate somebody disables. Raising this to
      # `-D warnings` is a task for whoever clears those ten.
      #
      # (Phase 5, 2026-11-02: on macOS the crate itself reports none under
      # either feature set — the only warning printed is the vendored
      # gpui_macos's. Linux was not re-measured.)
      - name: Clippy
        run: cargo clippy --all-targets
      # The parallel space's seam is compiled only with `dev-fixtures`
      # (Cargo.toml), and so are its tests — 23 more, the multisig page's
      # vector replay among them. Linted and tested both ways: the plain build
      # is the shape that ships (the space absent), the featured one is the
      # shape every scripted pass and the perf harness run.
      - name: Clippy (dev-fixtures)
        run: cargo clippy --all-targets --features dev-fixtures
      - name: Tests
        # `sweep-gallery.sh` is deliberately NOT here: it opens real windows and
        # a CI runner has no display. It stays a local gate, and saying so keeps
        # the next reader from assuming a coverage that does not exist.
        run: cargo test
      - name: Tests (dev-fixtures)
        run: cargo test --features dev-fixtures

  # The Windows half of the desktop app — the code `desktop:` above CANNOT see.
  #
  # `desktop:` builds on Linux, so everything under `#[cfg(windows)]` (the
  # webauthn.dll passkey route, the CCID wire, the installer's resources) is
  # compiled for the first time by the RELEASE, on a push to release/v*. That is
  # what happened to 0.9.5: spec 075 added `KeyMethod::TrustedSigner`, the
  # Windows-only `win_attachment` match stopped being exhaustive, every PR was
  # green, five platforms built, and the sixth failed — so no tag, no Release,
  # and a second full run to publish.
  #
  # `cargo check`, not a build: it type-checks every cfg(windows) line, which is
  # the whole gap, without linking or packaging. The installer itself stays in
  # desktop-windows-packages.yml.
  desktop-windows:
    runs-on: windows-2025
    # As desktop-windows-packages.yml: bindgen in the tree needs libclang, and
    # windows-2025 ships LLVM here rather than on PATH.
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        working-directory: app-desktop/vela-wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app-desktop/vela-wallet
          # Same reason as `desktop:` — gpui is a git dependency on all of Zed.
          cache-all-crates: true
      - name: Check (every cfg(windows) line, tests included)
        run: cargo check --all-targets --locked

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # The native wire ruler (F0.3) in its strict mode: an operation, result
      # or required result field the core declares and the Kotlin wire does
      # not answer fails here, in words and in a second, before the Gradle
      # build; CoreWireDriftTest is the same question asked at runtime.
      - name: Native wire parity with the core (strict)
        run: node scripts/check-native-wire.mjs --strict
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # A fresh checkout CANNOT build this app: `rust/bindings/kotlin/` is
      # gitignored and consumed in place as a `kotlin.srcDir`, so the bindings
      # have to be generated before Gradle runs. The JVM unit tests then load the
      # HOST dylib through `jna.library.path`, which is the same artifact.
      - name: Generate the Kotlin bindings
        working-directory: rust
        # One recipe, shared with the laptops: it also stamps WHICH core the
        # bindings came from, and Gradle refuses to compile when that stamp and
        # the tree disagree (rust/scripts/check-android-core-fresh.sh).
        run: bash scripts/build-kotlin-bindings.sh
      # The parallel space's keyset is a SECOND, debug-only library with its own
      # bindings (spec 043, research D2): the debug source set compiles against
      # rust/bindings/kotlin-dev and the JVM tests load the host .so beside
      # vela-core-uniffi's. Host only — the ABIs are not needed to compile.
      - name: Generate the debug-only fixtures bindings
        working-directory: rust
        run: bash scripts/build-dev-fixtures.sh --host
      # `-PvelaSkipRustBuild` skips the three-ABI NDK cross-compile, which the
      # app's build.gradle.kts measures at ~6 minutes. Compiling and unit-testing
      # is what catches an unrouted screen; producing an installable APK is not.
      - name: Compile and unit-test
        working-directory: app-android/vela-wallet
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PvelaSkipRustBuild
      # Gradle reports a class that ran no test the same as one that passed.
      # CoreWireDriftTest and every class that replays the core's shared
      # vectors (listed in docs/scenarios/multisig.yaml, `vector_replays`) must
      # have RUN, with nothing skipped.
      - name: CoreWireDriftTest and the shared core vectors ran, none skipped
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          node scripts/ci/assert-test-results.mjs --platform android \
            --junit app-android/vela-wallet/app/build/test-results/testDebugUnitTest
      - name: Keep the JVM test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-test-reports
          path: |
            app-android/vela-wallet/app/build/reports/tests/testDebugUnitTest
            app-android/vela-wallet/app/build/test-results/testDebugUnitTest
          retention-days: 14

  # The unit suite on every PR; the UI suite (16 XCUITests, ~10 min on a
  # simulator) on every push to main and on a PR only when it carries the
  # `ios-ui` label — as Android, whose PR job runs no instrumented tests at
  # all. The suite used to run after the unit suite behind one build, and made
  # this the job every PR waited ~35 minutes for. On its own runner when it
  # runs (a public repository's macOS minutes are not billed). Neither leg is
  # a required check.
  ios:
    name: ios (${{ matrix.suite }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # One unit leg. Its ~1260 tests run in about a minute here (13 s on a
        # laptop); the leg's time is the build, which a second machine would
        # only repeat. #457 tried two shards: under a minute saved, for a
        # second of the five macOS runners a free organisation gets.
        suite: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ios-ui')) && '["unit","ui"]' || '["unit"]') }}
    env:
      # The simulator slice alone, built for build time (`ci-ios` profile): the
      # tests run on the simulator, and `release`'s LTO + size optimisation
      # were the longest step here. What ships still builds `release`
      # (ios-package.yml), so nothing that reaches a person changes.
      VELA_IOS_SIM_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's DEFAULT Xcode is not the one this source compiles under.
      #
      # `Core/CoreStore.swift` and `OnboardingModel.swift` carry
      # `nonisolated deinit` — spec 058's workaround for a swift-frontend 6.2
      # optimizer crash, so the source REQUIRES 6.2 by construction. macos-15
      # still defaults to Xcode 16.4 (Swift 6.1), where that spelling is an
      # experimental feature, and every run since has died on
      # "'isolated' deinit requires frontend flag
      # -enable-experimental-feature IsolatedDeinit" — in two files nobody was
      # editing, which is why it read like somebody's change and was not.
      #
      # Pick the newest Xcode the image actually carries rather than naming a
      # version that may not be installed, and say so out loud if it is still
      # too old: a sentence naming the runner image beats a frontend flag
      # error in a file the reader did not touch.
      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
          major=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\1/p' | head -1)
          minor=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\2/p' | head -1)
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $major.$minor is too old: app-ios needs 6.2 for \`nonisolated deinit\` (spec 058). The newest Xcode on this image is $newest — bump \`runs-on\` to an image that ships Xcode 26 or later."
            exit 1
          fi
      # Same story as Android: `app-ios/VelaCoreKit/Artifacts/` is gitignored, so
      # the xcframework must be built before Xcode can resolve the local package.
      # macos-15 minutes bill at ten times linux, so this is the step that decides
      # the job's cost — cache it on the core's own sources, and it is a
      # ~6-minute job rather than a ~25-minute one.
      - name: Cache the xcframework
        id: xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app-ios/VelaCoreKit/Artifacts
          # What the library is built from: the crates' sources, not their
          # tests — a PR that only touches Rust tests reuses the last build.
          key: xcframework-sim-ci-${{ hashFiles('rust/crates/**', '!rust/crates/**/tests/**', 'rust/Cargo.lock', 'rust/Cargo.toml', 'rust/scripts/build-ios-xcframework.sh') }}
      # The SECOND library: the parallel space's fixed keyset (spec 052 D1).
      #
      # `Dev/vela_dev_fixtures.swift` is committed and compiled by the DEBUG
      # configuration, so a Debug build needs its FFI — and
      # `VelaDevFixturesKit/Artifacts/` is gitignored like the core's. Without
      # this step the iOS job fails at "cannot find type 'RustBuffer' in
      # scope", which is where it has failed on every run since 052: the same
      # shape Android already solves with its `build-dev-fixtures.sh` step.
      # Release links neither the keys nor the door, which is what
      # `EXCLUDED_SOURCE_FILE_NAMES` and the archived binary's symbols prove.
      - name: Cache the dev-fixtures xcframework
        id: devfixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app-ios/VelaDevFixturesKit/Artifacts
          key: devfixtures-sim-ci-${{ hashFiles('rust/crates/**', '!rust/crates/**/tests/**', 'rust/Cargo.lock', 'rust/Cargo.toml', 'rust/scripts/build-ios-dev-fixtures.sh') }}
      # Rust only when a library has to be built: on a hit nothing below runs
      # cargo, and the toolchain plus 330 MB of target/ cost ~40 s for nothing.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-11-12
        if: steps.xcframework.outputs.cache-hit != 'true' || steps.devfixtures.outputs.cache-hit != 'true'
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.xcframework.outputs.cache-hit != 'true' || steps.devfixtures.outputs.cache-hit != 'true'
        with:
          workspaces: rust
          # Its own cache: this job builds the `ci-ios` profile, and the key
          # it shared with the old `release` build restored 428 MB of release
          # artifacts it could not use — and, being an exact hit, never saved
          # the ones it built. Both legs build the same thing, so they share it.
          shared-key: ios-sim-ci
      - name: Build the xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: ./rust/scripts/build-ios-xcframework.sh
      - name: Build the dev-fixtures xcframework
        if: steps.devfixtures.outputs.cache-hit != 'true'
        run: ./rust/scripts/build-ios-dev-fixtures.sh
      # The destination is RESOLVED, not spelled. Two traps, both hit while
      # writing this job:
      #   - `name=iPhone 16` is ambiguous the moment a machine has that device
      #     under two runtimes, and xcodebuild answers by printing every
      #     simulator it knows rather than picking one.
      #   - `OS=latest` does not mean "newest runtime that has this device"; it
      #     means the newest runtime, which may not offer that device at all.
      # Asking simctl for a device that actually exists sidesteps both.
      - name: Resolve a simulator that actually exists
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for runtime, devices in d.items():
              if "iOS" not in runtime: continue
              ver=tuple(int(x) for x in runtime.split(".iOS-")[-1].split("-"))
              for dev in devices:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      if best is None or ver > best[0]: best=(ver, dev["udid"], dev["name"], runtime)
          if best is None: sys.exit("no available iPhone simulator")
          print(best[1])
          print(f"using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # NOTE on reading this job's output: the XCTest reporter prints
      # "Executed 0 tests" here and it is NOT a failure. VelaWalletTests uses
      # Swift Testing (`@Test`), which reports on its own line — "Test run with
      # 130 tests in 13 suites passed". Anything that greps this log for a pass
      # signal must look for the second line, not the first.
      # Native parity F0.3: every operation, result and required field the core
      # sends is answered by the iOS shell (reports: app-ios/scripts/reports/).
      - name: iOS wire parity with the core
        run: |
          node --test app-ios/scripts/check-ios-wire-parity.test.mjs
          node app-ios/scripts/check-ios-wire-parity.mjs --strict
      - name: Build and test
        working-directory: app-ios/VelaWallet
        run: |
          # This leg's tests: the UI suite, or everything else.
          if [ "${{ matrix.suite }}" = ui ]; then
            TESTS=-only-testing:VelaWalletUITests
          else
            TESTS=-skip-testing:VelaWalletUITests
          fi
          # No index store: nothing here searches the code, and building one
          # costs compile time.
          set -o pipefail
          # The shared VM is ~4x slower than a developer's Mac: wall-clock
          # budgets in the tests scale by this (TEST_RUNNER_ reaches the test
          # process without its prefix).
          export TEST_RUNNER_VELA_PERF_SCALE=4
          xcodebuild test \
            -project VelaWallet.xcodeproj \
            -scheme VelaWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/${{ matrix.suite }}.xcresult" \
            $TESTS \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          # A filter that selects nothing passes green with zero tests. The
          # unit leg holds over a thousand; under a hundred is a broken filter.
          if [ "${{ matrix.suite }}" = unit ]; then
            ran=$(grep -oE 'Test run with [0-9]+ tests' "$RUNNER_TEMP/xcodebuild.log" | tail -1 | grep -oE '[0-9]+' || true)
            echo "unit ran ${ran:-0} tests"
            if [ "${ran:-0}" -lt 100 ]; then
              echo "::error::the unit leg ran ${ran:-0} Swift tests; its filter selected (almost) nothing."
              exit 1
            fi
          fi
      # A count says the filter selected something; it does not say WHICH. The
      # suites that replay the core's shared vectors (docs/scenarios/
      # multisig.yaml, `vector_replays`) must each have run, every test in
      # them passed — not skipped by an `.enabled(if:)` somebody added.
      - name: The shared core vectors ran, none skipped
        if: matrix.suite == 'unit'
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          node scripts/ci/assert-test-results.mjs --platform ios --xcresult "$RUNNER_TEMP/unit.xcresult"
      # The suite above runs on the NEWEST runtime, and the deployment target is
      # iOS 17.4. 087 F33: Swift 6.2 builds `nonisolated(nonsending)` function
      # metadata with an iOS 18 runtime entry point it weak-links with no
      # fallback, so on iOS 17 attaching a feedback screenshot was a call to
      # address 0 — while every suite here passed.
      #
      # Why a symbol check and not an iOS 17 simulator: macos-15 carries iOS
      # 18.5, 18.6 and 26.x runtimes and no iOS 17 one (image 20260907), and
      # iOS 18 has the entry point, so neither catches it. Downloading the 17.5
      # runtime is ~7 GB plus a second full suite run on every push, on minutes
      # that bill at ten times Linux. What the crash needs is visible in the
      # binary — an import of `swift_getExtendedFunctionTypeMetadata` — so this
      # step reads that instead, and covers every code path, not only the ones
      # a test happens to walk. The self-test proves the check still bites on
      # this toolchain. Before a TestFlight build, also run VelaWalletTests on an
      # iOS 17.5 simulator locally (087 results, F33).
      - name: Nothing the iOS 17 runtime lacks
        # The app's binaries are the same in both legs; checked once.
        if: matrix.suite == 'unit'
        run: |
          node app-ios/scripts/check-ios17-function-metadata.mjs --self-test
          node app-ios/scripts/check-ios17-function-metadata.mjs "$RUNNER_TEMP/dd/Build/Products"
