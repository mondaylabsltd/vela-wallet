# The clear-signing page (app-web/clearsigning): one static folder that is both
# a web page and a Chrome MV3 extension, zero build, zero dependencies. This
# packages that folder as an extension zip and attaches it to a GitHub release
# on a `clearsigning-v*` tag.
#
# Same shape as web-extension-package.yml: a tag cuts a release, a manual run
# only builds, a pull request that touches the folder runs the checks (all of
# them — there is nothing expensive here).
#
# What is packaged: everything Chrome loads. What is not: the samples/ harness
# scripts (Node-only, for the maintainer), the three markdown documents, and
# the gallery page (a fixture board, not a door a user has). A file that is
# neither is a mistake worth failing on — the allow-list below is explicit.
name: Clear-signing package

on:
  # Cutting a release: `git tag clearsigning-v0.1.0 && git push --tags`.
  # The tag's version must equal `version` in app-web/clearsigning/manifest.json.
  push:
    tags: ['clearsigning-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'app-web/clearsigning/**'
      - '.github/workflows/clearsigning-package.yml'

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The manifest must parse and keep its constraints
        working-directory: app-web/clearsigning
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const fail = (msg) => { console.error(`::error::${msg}`); process.exit(1); };
          if (m.manifest_version !== 3) fail('manifest_version must be 3');
          if (!(m.host_permissions ?? []).includes('https://getvela.app/*')) fail('host_permissions lost https://getvela.app/*');
          if (!(m.externally_connectable?.matches ?? []).includes('https://getvela.app/*')) fail('externally_connectable lost https://getvela.app/* — the wallet could not reach the page');
          const csp = m.content_security_policy?.extension_pages ?? '';
          if (!/script-src 'self'/.test(csp)) fail("extension_pages CSP must keep script-src 'self' (no inline script loads under MV3)");
          if (!/^\d+\.\d+\.\d+$/.test(m.version)) fail(`version "${m.version}" is not x.y.z`);
          for (const f of ['index.html', 'sign.html', 'background.js', m.background?.service_worker]) {
            if (f && !fs.existsSync(f)) fail(`${f} is named by the manifest or the page set but missing`);
          }
          console.log(`manifest ok: ${m.name} ${m.version}`);
          JS
      - name: A release tag must name the manifest version
        if: startsWith(github.ref, 'refs/tags/clearsigning-v')
        working-directory: app-web/clearsigning
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#clearsigning-v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $tag but manifest.json says $version — bump the manifest and re-tag"
            exit 1
          fi
      - name: No inline script in any packaged page
        # MV3 refuses to load an extension whose pages carry inline <script>;
        # the folder is hand-written, so this is the one build-time check it has.
        working-directory: app-web/clearsigning
        run: |
          if grep -nE '<script(>|[^>]*[^c]>)[^<]' index.html sign.html | grep -vE 'src=' ; then
            echo "::error::an inline <script> body in a packaged page — MV3 will refuse to load it"; exit 1
          fi
          echo "no inline script"
      - name: Package
        id: package
        working-directory: app-web/clearsigning
        run: |
          version=$(node -p "require('./manifest.json').version")
          name="vela-clearsigning-${version}"
          # Explicit allow-list: every top-level entry Chrome may load.
          zip -qr "../../${name}.zip" manifest.json index.html sign.html app.js sign.js background.js app.css sheet.css icons lib
          unzip -l "../../${name}.zip" | tail -1
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: clearsigning
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  release:
    name: Attach the package to the release
    if: startsWith(github.ref, 'refs/tags/clearsigning-v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance (spec 081, FR-012), for the same reason and in the same shape
      # as release.yml: `id-token` mints the short-lived identity that signs the
      # attestation, `attestations` records it against this repository. It lives
      # in the publishing job only — the `package` job above also runs on pull
      # requests, where there is nothing to attest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checksums alongside the package
        working-directory: artifacts
        run: |
          sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS-clearsigning"
          mv "$RUNNER_TEMP/SHA256SUMS-clearsigning" SHA256SUMS-clearsigning
          cat SHA256SUMS-clearsigning
      # Where the zip came from, not merely what it hashes to:
      #     gh attestation verify vela-clearsigning-<version>.zip \
      #       --repo mondaylabsltd/vela-wallet
      - name: Provenance for the package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*'
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vela Clear Signing $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            artifacts/* \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
