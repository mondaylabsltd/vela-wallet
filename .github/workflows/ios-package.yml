# Release build of the iOS shell (app-ios/VelaWallet): an UNSIGNED device
# archive, packaged as an .ipa-shaped zip, kept as a workflow artifact on an
# `ios-v*` tag.
#
# NOT attached to a GitHub Release, by ruling (spec 063 §0): the phone apps ship
# through the stores. An unsigned .ipa on a download page is a file nobody can
# install — iOS has no way to put it on a device — so publishing it only ever
# produced a broken download.
#
# What the tag still buys, and why the workflow stays:
#   * the .xcarchive the founder opens in Xcode's organizer to sign and submit
#     — the artifact below; and
#   * the check that the ARCHIVE path still compiles. It builds
#     `-O -whole-module-optimization` under the newest Xcode, which ci.yml's
#     debug test build does not, and it is the path 0.9.0 found broken.
#
# Unsigned on purpose (founder, 2026-09-11: 不用考虑签名). The archive is built
# with code signing disabled; signing it with the team's certificate and
# profile (Xcode "Distribute" on the .xcarchive, or `codesign` + a re-zip) is a
# local step — see docs/project-takeover/05.
#
# macos-15 minutes bill at ten times Linux, so the xcframework is cached on the
# core's own sources exactly as the `ios` job in ci.yml does.
name: iOS package

on:
  # Cutting an iOS build: `git tag ios-v1.0 && git push origin ios-v1.0`
  # — one tag per push; several tags in one push trigger nothing (spec 063 FR-007).
  # The tag's version must equal MARKETING_VERSION in the Xcode project.
  push:
    tags: ['ios-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'app-ios/VelaWallet/VelaWallet.xcodeproj/project.pbxproj'
      - 'rust/scripts/build-ios-xcframework.sh'
      - '.github/workflows/ios-package.yml'

permissions:
  contents: read

jobs:
  metadata:
    name: Validate the packaging metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MARKETING_VERSION / bundle id / deployment target are set
        run: |
          f=app-ios/VelaWallet/VelaWallet.xcodeproj/project.pbxproj
          for k in MARKETING_VERSION CURRENT_PROJECT_VERSION PRODUCT_BUNDLE_IDENTIFIER IPHONEOS_DEPLOYMENT_TARGET; do
            grep -q "$k = " "$f" || { echo "::error::$f no longer sets $k"; exit 1; }
          done
          test -f app-ios/VelaWallet/VelaWallet.xcodeproj/xcshareddata/xcschemes/VelaWallet.xcscheme \
            || { echo "::error::the VelaWallet scheme is not shared — xcodebuild on a runner cannot see it"; exit 1; }
      - name: A release tag must name MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          version=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' app-ios/VelaWallet/VelaWallet.xcodeproj/project.pbxproj | sed 's/MARKETING_VERSION = //')
          tag="${GITHUB_REF_NAME#ios-v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $tag but the project says MARKETING_VERSION $version — bump it and re-tag"
            exit 1
          fi

  package:
    name: Build the unsigned archive
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's DEFAULT Xcode is not the one this source compiles under —
      # the same reason ci.yml's `ios` job picks one, and the reason this
      # workflow had never produced an archive. `Core/CoreStore.swift` and
      # `OnboardingModel.swift` carry `nonisolated deinit` (spec 058's
      # workaround for a swift-frontend 6.2 optimizer crash), so the source
      # REQUIRES 6.2 by construction, while macos-15 still defaults to Xcode
      # 16.4 / Swift 6.1 where that spelling is an experimental feature.
      #
      # This path is MORE exposed than ci.yml's, not less: the archive builds
      # `-O -whole-module-optimization`, which is the optimizer that workaround
      # exists for. A release build is the last place to discover that.
      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
          major=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\1/p' | head -1)
          minor=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\2/p' | head -1)
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $major.$minor is too old: app-ios needs 6.2 for \`nonisolated deinit\` (spec 058). The newest Xcode on this image is $newest — bump \`runs-on\` to an image that ships Xcode 26 or later."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # app-ios/VelaCoreKit/Artifacts/ is gitignored, so the xcframework must be
      # built before Xcode can resolve the local package (same as ci.yml).
      - name: Cache the xcframework
        id: xcframework
        uses: actions/cache@v4
        with:
          path: app-ios/VelaCoreKit/Artifacts
          key: xcframework-${{ hashFiles('rust/crates/**', 'rust/Cargo.lock') }}
      - name: Build the xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: ./rust/scripts/build-ios-xcframework.sh
      - name: Archive (device, code signing disabled)
        working-directory: app-ios/VelaWallet
        run: |
          xcodebuild archive \
            -project VelaWallet.xcodeproj \
            -scheme VelaWallet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VelaWallet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -20
          test -d "$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app"
      - name: Package
        working-directory: app-ios/VelaWallet
        run: |
          version=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' VelaWallet.xcodeproj/project.pbxproj | sed 's/MARKETING_VERSION = //')
          mkdir -p out "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app" "$RUNNER_TEMP/Payload/"
          # An .ipa is a zip with Payload/<App>.app at its root; unsigned here.
          (cd "$RUNNER_TEMP" && zip -qry "$OLDPWD/out/vela-wallet-ios-${version}-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP" && zip -qry "$OLDPWD/out/vela-wallet-ios-${version}.xcarchive.zip" VelaWallet.xcarchive)
          ls -l out
      - name: Checksums travel with the packages
        working-directory: app-ios/VelaWallet/out
        run: |
          shasum -a 256 ./* > "$RUNNER_TEMP/SHA256SUMS-ios"
          mv "$RUNNER_TEMP/SHA256SUMS-ios" SHA256SUMS-ios
          cat SHA256SUMS-ios
      # The artifact IS the deliverable: download it from the run, sign, submit.
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: app-ios/VelaWallet/out/*
          if-no-files-found: error
