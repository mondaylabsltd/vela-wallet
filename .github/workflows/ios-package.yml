# Release build of the iOS shell (app-ios/VelaWallet): an UNSIGNED device
# archive, packaged as an .ipa-shaped zip, kept as a workflow artifact on an
# archive of every release (release.yml calls this).
#
# NOT attached to a GitHub Release, by ruling (spec 063 §0): the phone apps ship
# through the stores. An unsigned .ipa on a download page is a file nobody can
# install — iOS has no way to put it on a device — so publishing it only ever
# produced a broken download.
#
# What the tag still buys, and why the workflow stays:
#   * the .xcarchive the founder opens in Xcode's organizer to sign and submit
#     — the artifact below; and
#   * the check that the ARCHIVE path still compiles. It builds
#     `-O -whole-module-optimization` under the newest Xcode, which ci.yml's
#     debug test build does not, and it is the path 0.9.0 found broken.
#
# Unsigned on purpose (founder, 2026-09-11: 不用考虑签名). The archive is built
# with code signing disabled; signing it with the team's certificate and
# profile (Xcode "Distribute" on the .xcarchive, or `codesign` + a re-zip) is a
# local step — see docs/project-takeover/05.
#
# macos-15 minutes bill at ten times Linux, so the xcframework is cached on the
# core's own sources exactly as the `ios` job in ci.yml does.
name: iOS package

on:
  # A release is cut by release.yml, which CALLS this workflow for the commit
  # at the head of `release/vX.Y.Z` (spec 064). There is no tag trigger any
  # more: one way to release, and this file stays the single definition of how
  # the package is made. `workflow_dispatch` is the build check it has been
  # since 0.9.0 — run it on a branch before merging anything that touches
  # packaging, because a pull request skips every build job below.
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app-ios/VelaWallet/VelaWallet.xcodeproj/project.pbxproj'
      - 'rust/scripts/build-ios-xcframework.sh'
      - '.github/workflows/ios-package.yml'

# Every build says which commit it is (spec 064 §3). Set here, from the commit
# that was checked out, because a container build often cannot ask git itself.
env:
  VELA_GIT_COMMIT: ${{ github.sha }}

permissions:
  contents: read

jobs:
  metadata:
    name: Validate the packaging metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MARKETING_VERSION / bundle id / deployment target are set
        run: |
          f=app-ios/VelaWallet/VelaWallet.xcodeproj/project.pbxproj
          for k in MARKETING_VERSION CURRENT_PROJECT_VERSION PRODUCT_BUNDLE_IDENTIFIER IPHONEOS_DEPLOYMENT_TARGET; do
            grep -q "$k = " "$f" || { echo "::error::$f no longer sets $k"; exit 1; }
          done
          test -f app-ios/VelaWallet/VelaWallet.xcodeproj/xcshareddata/xcschemes/VelaWallet.xcscheme \
            || { echo "::error::the VelaWallet scheme is not shared — xcodebuild on a runner cannot see it"; exit 1; }

  package:
    name: Build the unsigned archive
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's DEFAULT Xcode is not the one this source compiles under —
      # the same reason ci.yml's `ios` job picks one, and the reason this
      # workflow had never produced an archive. `Core/CoreStore.swift` and
      # `OnboardingModel.swift` carry `nonisolated deinit` (spec 058's
      # workaround for a swift-frontend 6.2 optimizer crash), so the source
      # REQUIRES 6.2 by construction, while macos-15 still defaults to Xcode
      # 16.4 / Swift 6.1 where that spelling is an experimental feature.
      #
      # This path is MORE exposed than ci.yml's, not less: the archive builds
      # `-O -whole-module-optimization`, which is the optimizer that workaround
      # exists for. A release build is the last place to discover that.
      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
          major=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\1/p' | head -1)
          minor=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\.\([0-9]*\).*/\2/p' | head -1)
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::Swift $major.$minor is too old: app-ios needs 6.2 for \`nonisolated deinit\` (spec 058). The newest Xcode on this image is $newest — bump \`runs-on\` to an image that ships Xcode 26 or later."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # app-ios/VelaCoreKit/Artifacts/ is gitignored, so the xcframework must be
      # built before Xcode can resolve the local package (same as ci.yml).
      - name: Cache the xcframework
        id: xcframework
        uses: actions/cache@v4
        with:
          path: app-ios/VelaCoreKit/Artifacts
          key: xcframework-${{ hashFiles('rust/crates/**', 'rust/Cargo.lock') }}
      - name: Build the xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: ./rust/scripts/build-ios-xcframework.sh
      - name: Archive (device, code signing disabled)
        working-directory: app-ios/VelaWallet
        run: |
          xcodebuild archive \
            -project VelaWallet.xcodeproj \
            -scheme VelaWallet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VelaWallet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            VELA_GIT_COMMIT="$(git rev-parse --short=7 HEAD)" \
            | tail -20
          # The build setting has been waiting for a value since spec 058, and this
          # workflow never passed one — so every archive said "build 1" (spec 064).
          stamped=$(/usr/libexec/PlistBuddy -c 'Print :VelaGitCommit' \
            "$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app/Info.plist")
          [ "$stamped" = "$(git rev-parse --short=7 HEAD)" ] || {
            echo "::error::the archive says commit '$stamped', not $(git rev-parse --short=7 HEAD)"; exit 1; }
          test -d "$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app"
      # App Review rejects a binary that calls a required-reason API its privacy
      # manifest does not declare, and this manifest is a plain file inside a
      # folder-synchronised group: nothing in project.pbxproj names it, so
      # nothing in project.pbxproj would notice it going missing. Three
      # assertions, made on the ARCHIVE — the artifact that is actually
      # submitted (spec 081 FR-014):
      #
      #   1. the manifest reached the bundle ROOT, which is where Apple looks;
      #   2. it parses;
      #   3. what the binary IMPORTS is a subset of what the manifest DECLARES.
      #
      # (3) is the one that earns its keep, and it is what settled FR-014: the
      # app imports stat/fstat/lstat — Apple's FileTimestamp API — out of
      # Rust's own `std`, which a static archive links whole, and NOT out of
      # the uniffi generator the research blamed. A dependency can add a
      # required-reason category without anyone writing a line of Swift, and
      # only the binary shows it.
      - name: Privacy manifest is present, valid, and matches the binary
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app"
          MANIFEST="$APP/PrivacyInfo.xcprivacy"
          test -f "$MANIFEST" || {
            echo "::error::PrivacyInfo.xcprivacy is not at the app bundle root. It ships from app-ios/VelaWallet/VelaWallet/, a PBXFileSystemSynchronizedRootGroup owned by the VelaWallet target — check the file is still there and the group is still synchronised."
            exit 1; }
          plutil -lint "$MANIFEST"
          # Flipping this to true means App Tracking Transparency, a prompt, and
          # a privacy policy that no longer matches getvela.app/privacy.
          tracking=$(plutil -extract NSPrivacyTracking raw -o - "$MANIFEST")
          [ "$tracking" = "false" ] || { echo "::error::NSPrivacyTracking is '$tracking', not false"; exit 1; }
          plutil -extract NSPrivacyTrackingDomains raw -o - "$MANIFEST" >/dev/null

          nm -u "$APP/VelaWallet" | sed 's/^[[:space:]]*//' | sort -u > "$RUNNER_TEMP/ios-imports.txt"
          declared=$(plutil -convert json -o - "$MANIFEST")
          rc=0
          # $1 = Apple's category, $2 = an ERE matched against WHOLE symbol names.
          require() {
            hits=$(grep -Ex -- "$2" "$RUNNER_TEMP/ios-imports.txt" | tr '\n' ' ') || true
            [ -n "$hits" ] || return 0
            case "$declared" in
              *"NSPrivacyAccessedAPICategory$1"*)
                echo "ok: $1 declared — imported: $hits" ;;
              *)
                echo "::error::the binary imports $hits — Apple's $1 required-reason API — but PrivacyInfo.xcprivacy does not declare NSPrivacyAccessedAPICategory$1. Either stop importing it (find out what pulled it in; a build-time-only dependency linked into a shipped crate is the usual cause) or declare it with the reason that is actually true."
                rc=1 ;;
            esac
          }
          require FileTimestamp '_(f|l)?stat(64)?(\$INODE64)?|_fstatat(64)?|_f?getattrlist|_getattrlistat|_getattrlistbulk|_NSFileCreationDate|_NSFileModificationDate|_NSURLContentModificationDateKey|_NSURLCreationDateKey'
          require DiskSpace '_f?statfs(64)?|_NSFileSystemFreeSize|_NSFileSystemSize|_NSURLVolumeAvailableCapacity(ForImportantUsage|ForOpportunisticUsage)?Key|_NSURLVolumeTotalCapacityKey'
          require SystemBootTime '_mach_absolute_time|_mach_continuous_time'
          require UserDefaults '_OBJC_CLASS_\$_NSUserDefaults|_CFPreferences(CopyAppValue|SetAppValue|CopyValue|SetValue|AppSynchronize)'
          require ActiveKeyboards '_OBJC_CLASS_\$_UITextInputMode'
          exit $rc
      - name: Package
        working-directory: app-ios/VelaWallet
        run: |
          version=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' VelaWallet.xcodeproj/project.pbxproj | sed 's/MARKETING_VERSION = //')
          mkdir -p out "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/VelaWallet.xcarchive/Products/Applications/VelaWallet.app" "$RUNNER_TEMP/Payload/"
          # An .ipa is a zip with Payload/<App>.app at its root; unsigned here.
          (cd "$RUNNER_TEMP" && zip -qry "$OLDPWD/out/vela-wallet-ios-${version}-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP" && zip -qry "$OLDPWD/out/vela-wallet-ios-${version}.xcarchive.zip" VelaWallet.xcarchive)
          ls -l out
      - name: Checksums travel with the packages
        working-directory: app-ios/VelaWallet/out
        run: |
          shasum -a 256 ./* > "$RUNNER_TEMP/SHA256SUMS-ios"
          mv "$RUNNER_TEMP/SHA256SUMS-ios" SHA256SUMS-ios
          cat SHA256SUMS-ios
      # The artifact IS the deliverable: download it from the run, sign, submit.
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: app-ios/VelaWallet/out/*
          if-no-files-found: error
