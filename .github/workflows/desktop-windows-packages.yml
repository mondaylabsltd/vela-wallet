# Windows installers for the GPUI desktop app: Setup.exe for x64 and ARM64.
#
# This is the third leg of the desktop release triad — desktop-linux-packages
# and desktop-macos-packages are called by release.yml for the same commit, and all three
# attach their artifacts to the same GitHub release, so one tag ships every
# platform.
#
# Both installers build on x64 runners: the packaging script drives Visual
# Studio's x64-hosted ARM64 cross toolchain (vswhere → VsDevCmd -arch=arm64),
# exactly as it does on a local x64 dev box. Everything the script probes for
# is preinstalled on the windows-2025 image: VS 2022 with the ARM64 C++
# component, LLVM's libclang for bindgen, and Inno Setup 6 — the script stops
# with an actionable error if any of them ever disappears from the image.
name: Desktop Windows packages

on:
  # A release is cut by release.yml, which CALLS this workflow for the commit
  # at the head of `release/vX.Y.Z` (spec 064). There is no tag trigger any
  # more: one way to release, and this file stays the single definition of how
  # the package is made. `workflow_dispatch` is the build check it has been
  # since 0.9.0 — run it on a branch before merging anything that touches
  # packaging, because a pull request skips every build job below.
  workflow_call:
  workflow_dispatch:
  # Packaging metadata is cheap to check and easy to break, so it is checked on
  # every PR that touches it. The installer builds are not — Windows runner
  # minutes bill at 2x the Linux rate, and the cold gpui build is long.
  pull_request:
    paths:
      - 'app-desktop/vela-wallet/installer/**'
      - 'app-desktop/vela-wallet/scripts/build-windows-installer.ps1'
      - '.github/workflows/desktop-windows-packages.yml'

# Every build says which commit it is (spec 064 §3). Set here, from the commit
# that was checked out, because a container build often cannot ask git itself.
env:
  VELA_GIT_COMMIT: ${{ github.sha }}

permissions:
  contents: read

jobs:
  metadata:
    name: Validate installer packaging
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: The packaging script must parse
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/app-desktop/vela-wallet/scripts/build-windows-installer.ps1",
            [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: The Inno Setup script must accept every define the build passes
        # ISCC is only invoked at package time, after the release build — a
        # renamed or dropped /D macro would otherwise surface an hour in.
        shell: pwsh
        run: |
          $iss = 'app-desktop/vela-wallet/installer/VelaWallet.iss'
          if (-not (Test-Path -LiteralPath $iss)) { throw "missing $iss" }
          foreach ($define in 'MyAppVersion', 'MyAppExe', 'MyVCRedist',
                              'MyVCRedistName', 'MyArchitecture',
                              'MyArchitecturesAllowed', 'MyOutputDir') {
            if (-not (Select-String -Path $iss -Pattern $define -Quiet)) {
              throw "VelaWallet.iss no longer references $define, but the build script passes /D$define"
            }
          }

  installer:
    name: Installer (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-targets: ''
          - arch: arm64
            rust-targets: aarch64-pc-windows-msvc
    env:
      # bindgen (dotlottie-rs) needs libclang; the runner image ships LLVM but
      # not the variable.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/vela-wallet
          # gpui and gpui_platform are git dependencies on the whole Zed
          # repository; without caching, every run re-clones it.
          cache-all-crates: true
      - name: Build the installer
        working-directory: app-desktop/vela-wallet
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Architecture ${{ matrix.arch }}
      # Spec 064 §3, asserted where it matters: in the package, not in a test beside it.
      - name: The binary says which commit it is
        working-directory: app-desktop/vela-wallet
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $exe = Get-ChildItem target -Recurse -Filter vela-wallet.exe |
            Where-Object { $_.FullName -match '\\release\\vela-wallet\.exe$' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error "no release vela-wallet.exe under target/"; exit 1 }
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          if (-not $text.Contains($sha)) {
            Write-Output "::error::$($exe.FullName) does not carry commit $sha — About would show something else"; exit 1 }
          Write-Output "$($exe.Name) carries $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: app-desktop/vela-wallet/dist/windows/*.exe
          if-no-files-found: error
