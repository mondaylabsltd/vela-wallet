<!doctype html>
<!--
  The Safari extension's device harness (native AUDIT §6.5): a dApp in iOS
  Safari, asking the Vela extension what any dApp asks. Served by the UI test
  (LocalDappServer), so its origin is http://127.0.0.1:<port>.

  The two links are the development package's doorway (`dev-bridge.js` turns
  `data-vela-dev` into the extension page's real, per-launch URL): the probe,
  and the seed that points the wallet at the fork harness (__SEED__ is filled
  in by the test from the harness's ports).
-->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Safari test dApp</title>
	<style>
		body { font: 17px -apple-system, sans-serif; margin: 16px; }
		button, a { display: block; margin: 10px 0; padding: 12px; font-size: 17px; }
		pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
	</style>
</head>
<body>
	<h1>Safari test dApp</h1>
	<a id="probe" data-vela-dev="dev-probe.html">Open the extension probe</a>
	<a id="seed" data-vela-dev="__SEED__">Seed the harness wallet</a>
	<a id="handoff" data-vela-dev="__HANDOFF__">Hand off to the signing page</a>
	<a id="handoff-refused" data-vela-dev="__HANDOFF__&amp;method=eth_sign">Hand off a request the page refuses</a>
	<button id="connect" type="button">Connect</button>
	<button id="switch" type="button">Switch to Gnosis</button>
	<button id="sign" type="button">Sign message</button>
	<button id="send" type="button">Send 0.001</button>
	<pre id="out">waiting…</pre>
	<script>
		const out = document.getElementById('out');
		const state = { provider: null, results: {} };
		const show = () => (out.textContent = JSON.stringify(state, null, 1));
		window.addEventListener('eip6963:announceProvider', (ev) => {
			state.provider = { name: ev.detail.info.name, rdns: ev.detail.info.rdns };
			show();
			// Safari exposes the title to a UI test; the <pre> it does not.
			if (!document.title.includes(':')) document.title = `provider:${ev.detail.info.rdns}`;
		});
		window.dispatchEvent(new Event('eip6963:requestProvider'));
		setTimeout(() => {
			state.legacy = !!window.ethereum && window.ethereum.isVela === true;
			window.dispatchEvent(new Event('eip6963:requestProvider'));
			show();
		}, 800);
		const ask = async (key, method, params) => {
			state.results[key] = { pending: true };
			show();
			try {
				const result = await window.ethereum.request({ method, params: params ?? [] });
				state.results[key] = { ok: true, result };
			} catch (error) {
				state.results[key] = { ok: false, code: error.code, message: error.message };
			}
			show();
			document.title = `${key}:${state.results[key].ok ? 'ok' : 'error'}`;
		};
		const me = () => (window.ethereum.selectedAddress || (state.results.connect?.result || [])[0]);
		document.getElementById('connect').onclick = () => ask('connect', 'eth_requestAccounts');
		document.getElementById('switch').onclick = () =>
			ask('switch', 'wallet_switchEthereumChain', [{ chainId: '0x64' }]);
		document.getElementById('sign').onclick = () =>
			ask('sign', 'personal_sign', ['0x48656c6c6f2c2056656c61', me()]);
		document.getElementById('send').onclick = () =>
			ask('send', 'eth_sendTransaction', [
				{ from: me(), to: '0x000000000000000000000000000000000000dEaD', value: '0x38d7ea4c68000' }
			]);
	</script>
</body>
</html>
