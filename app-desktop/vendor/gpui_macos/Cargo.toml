# Vendored copy of Zed's `crates/gpui_macos` at the commit the desktop app pins
# (zed-industries/zed c97b7c0ea41acf56e9726964eca10c2078e921b0), substituted
# through `[patch."https://github.com/zed-industries/zed"]` in
# app-desktop/vela-wallet/Cargo.toml (spec 095).
#
# WHY: the Mac App Store refuses a binary that links private API. Upstream
# gpui_macos imports `CGSMainConnectionID` / `CGSSetWindowBackgroundBlurRadius`
# and sends three private selectors. This copy is upstream minus exactly those
# (see the `spec 095` comments in src/window.rs); nothing else is changed.
# `scripts/check-macos-private-api.sh` asserts the result on the built binary.
#
# This manifest is upstream's with the workspace inheritance written out —
# every `x.workspace = true` replaced by the entry in Zed's root Cargo.toml at
# the same commit — so the crate resolves outside Zed's workspace. Zed's own
# crates (gpui, collections, gpui_util, media) stay git dependencies on the
# SAME source string the app uses, so cargo unifies them with the copies the
# rest of gpui is built against (a `rev =` here would make a second source,
# and with it a second, incompatible `gpui`).
#
# TO REFRESH when the gpui pin moves: copy crates/gpui_macos/src and build.rs
# from the new commit, re-apply the `spec 095` edits in src/window.rs, re-derive
# this manifest from the new root Cargo.toml, update the commit above, and run
# the private-API check on a release build. Drop the vendored copy (and the
# [patch]) as soon as upstream stops linking private API.
[package]
name = "gpui_macos"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Zed's `[workspace.lints.rust]`, which upstream inherits (its clippy table is
# not carried: clippy never runs on this crate here). Without it, every
# `cfg(feature = "cargo-clippy")` in the sources is a warning — this crate is a
# path dependency, so cargo does not cap its lints the way it does git ones.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_macos.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-task = "4.7"
block = "0.1"
block2 = "0.6"
cocoa = "=0.26.0"
collections = { git = "https://github.com/zed-industries/zed" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
ctor = "1.0.6"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
dispatch2 = "0.3.1"
etagere = "0.2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
futures = "0.3.32"
gpui_util = { git = "https://github.com/zed-industries/zed" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
media = { git = "https://github.com/zed-industries/zed" }
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSUndoManager",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-user-notifications = "0.3"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.27.2", features = ["derive"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
