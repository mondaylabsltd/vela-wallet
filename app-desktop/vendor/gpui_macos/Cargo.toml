# Vendored copy of Zed's `crates/gpui_macos` at the commit the desktop app pins
# — Zed v1.28.1, zed-industries/zed e8bc16acee5ae1937600d571d441c4b5d7b0d288 —
# substituted through `[patch."https://github.com/zed-industries/zed"]` in
# app-desktop/vela-wallet/Cargo.toml (spec 095).
#
# WHY: the Mac App Store refuses a binary that links or sends private API.
# Upstream gpui_macos at this commit sends `_zoomFill:` and three private
# selectors through the Objective-C runtime and overrides
# `_windowRestorationOptions` on an NSKeyedUnarchiver subclass. This copy is
# upstream minus exactly those (see the `spec 095` comments in src/window.rs).
# (The `CGSSetWindowBackgroundBlurRadius` import the first copy removed is gone
# upstream since then.) Nothing else is changed.
# `scripts/check-store-binary.sh` asserts the result on the built binary.
#
# This manifest is upstream's with the workspace inheritance written out —
# every `x.workspace = true` replaced by the entry in Zed's root Cargo.toml at
# the same commit — so the crate resolves outside Zed's workspace. Zed's own
# crates (gpui, gpui_apple, collections, gpui_util, scheduler) stay git
# dependencies on the SAME source string the app uses, so cargo unifies them
# with the copies the rest of gpui is built against. Since Round 22 that string
# carries the pinned `rev` (app-desktop/vela-wallet/Cargo.toml says why): a rev
# here that differs from the app's — or a missing one — would make a second
# source, and with it a second, incompatible `gpui`. Change all of them
# together. Upstream's macOS dev-dependencies are not carried: a path
# dependency's dev-dependencies are never built for the app.
#
# TO REFRESH when the gpui pin moves: copy crates/gpui_macos/src from the new
# commit (upstream has had no build.rs here since the Metal renderer moved to
# gpui_apple), re-apply the `spec 095` edits in src/window.rs — and grep the
# new sources for any OTHER private selector, class or symbol upstream has
# added since (`sel!(_`, `msg_send![…, _`, `AnyClass::get`, `CGS`/`SLS`) —
# re-derive this manifest from the new root Cargo.toml, update the commit above,
# and run the private-API check on a release build. Drop the vendored copy (and
# the [patch]) as soon as upstream stops linking private API.
[package]
name = "gpui_macos"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Zed's `[workspace.lints.rust]`, which upstream inherits (its clippy table is
# not carried: clippy never runs on this crate here). Without it, every
# `cfg(feature = "cargo-clippy")` in the sources is a warning — this crate is a
# path dependency, so cargo does not cap its lints the way it does git ones.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_macos.rs"
doctest = false

[features]
default = ["gpui/default"]
bench-support = ["gpui/bench-support", "gpui_apple/bench-support"]
test-support = ["gpui/test-support", "gpui_apple/test-support"]
runtime_shaders = ["gpui_apple/runtime_shaders"]
font-kit = ["gpui_apple/font-kit"]
screen-capture = ["gpui/screen-capture", "dep:objc2-core-media", "dep:objc2-screen-capture-kit"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
block2 = "0.6"
collections = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
ctor = "1.0.12"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
foreign-types = "0.5"
futures = "0.3.34"
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-uniform-type-identifiers",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "CGDirectDisplay",
    "CGColor",
    "objc2",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, optional = true, features = [
    "CMSampleBuffer",
    "objc2-core-video",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVHostTime",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalDisplayLink",
    "CAMetalLayer",
    "objc2-metal",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, optional = true, features = [
    "block2",
    "dispatch2",
    "objc2-core-graphics",
    "objc2-core-media",
    "SCShareableContent",
    "SCStream",
    "std",
] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = [
    "std",
    "UTCoreTypes",
    "UTType",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
parking_lot = "0.12.1"
raw-window-handle = "0.6"
scheduler = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.1", features = ["serde"] }
