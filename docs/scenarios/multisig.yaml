        - { file: rust/crates/vela-core/src/trusted_signer/owner_proof.rs, test: an_answer_is_held_to_the_challenge_the_genesis_makes, ci: required, note: '§16: a page''s owner proof accepted only over the challenge the genesis makes' }
        - { file: rust/crates/vela-core/tests/multisig_fork.rs, test: create_two_of_three_propose_approve_twice_execute, ci: nightly, note: 'against the fork harness; #[ignore] without VELA_MULTISIG_FORK' }
      web-unit:
        - { file: app-web/vela-wallet/src/lib/multisig/ui/CreateMultisigSheet.svelte.test.ts, test: 'one member is a 1 of 1 multisig, said what it means', ci: required }
        - { file: app-web/vela-wallet/src/lib/multisig/ui/CreateMultisigSheet.svelte.test.ts, test: 'hands every change to the machine to keep', ci: required }
        - { file: app-web/vela-wallet/src/lib/signing/sign-challenge.test.ts, test: 'a multisig member’s owner proof (§16): the genesis goes to the page, and only the sponsor challenge for the address it makes comes back', ci: required, note: 'the web, the Chrome extension and the Safari package hand the proof to the page' }
      web-e2e:
        - { file: app-web/vela-wallet/e2e/onchain/multisig.onchain.ts, test: 'a 2-of-3 multisig on one device: create, fund, propose, approve and execute', ci: nightly }
