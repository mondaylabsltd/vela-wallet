# The cross-platform multisig scenarios (native parity Phase 5, T1).
#
# One row per scenario the Arc rounds walked by hand on every platform; per
# platform, the automated tests that cover it — or `gap:` with what is missing.
# This is the map from "the scenario works" to "a test would go red if it
# stopped working", and the backlog where no such test exists.
#
# Gates (both run in CI; see docs/ci/test-loops.md):
#   scripts/ci/check-scenarios.mjs     every file exists and names the test
#                                      (ci.yml `app`, every PR); a `required`
#                                      test carries no skip marker
#   scripts/ci/assert-test-results.mjs the `required` tests of android-jvm,
#                                      web-unit and ios-unit, and every
#                                      `vector_replays` suite, actually RAN in
#                                      their ci.yml job — not skipped, not
#                                      filtered away
#
# Entry fields:
#   file   path from the repository root
#   test   the identifier, verbatim: Rust `fn` name, Kotlin `fun` name (no
#          backticks), Swift `func` name, vitest/Playwright title, or a check
#          label for app-web/trusted-signer/samples/*.mjs
#   suite  (optional) the class/struct a Kotlin or Swift test is reported
#          under, when it is not the first type declared above it
#   ci     where it runs:
#            required  ci.yml, every pull request
#            main      ci.yml on push to main, and PRs labelled `ios-ui` (iOS UI leg)
#            nightly   nightly.yml (non-blocking)
#            opt-in    needs a harness or device CI does not provide; skips without it
#            local     never in CI
#   note   (optional) what it does or does not prove
#
# Platforms: core (rust/), web-unit (vitest), web-e2e (Playwright, incl.
# e2e/onchain), android-jvm, android-instrumented, ios-unit, ios-ui, desktop,
# trusted-signer (the signing page's own suites).
#
# Mapped 2026-11-02 against feat/multisig-account 6cbc1e1e5; native gaps
# (android-instrumented, android-jvm member change, ios-unit, ios-ui) filled
# 2026-11-02 on gaps-native; the web and desktop gaps filled 2026-11-02
# (multisig-world.e2e.ts, extension-multisig-dapp, the fork suite's
# rejection, the desktop's reject scenarios).

version: 1

scenarios:
