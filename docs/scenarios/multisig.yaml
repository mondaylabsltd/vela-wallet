        - { file: app-ios/VelaWallet/VelaWalletUITests/MultisigLiveUITests.swift, test: test1CreateATwoOfThree, ci: opt-in, note: 'live; XCTSkip without the fork harness env' }
        - { file: app-ios/VelaWallet/VelaWalletUITests/R10FixLiveUITests.swift, test: test1CreateAndTheInviteCodeDecodesFromAScreenshot, ci: opt-in }
      desktop:
