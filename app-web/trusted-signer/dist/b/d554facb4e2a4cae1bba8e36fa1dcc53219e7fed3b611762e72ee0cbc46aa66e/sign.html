    <style>
/* The signing sheet + the gallery that shows 33 of them at once. */

:root {
  color-scheme: light dark;
  --bg: #f2f3f5;
  --surface: #ffffff;
  --card: #fafbfc;
  --fg: #0f1114;
  --muted: #6b7280;
  --faint: #9aa3ad;
  --hairline: #e6e8eb;
  --accent: #f46d50;
  --danger: #d92d20;
  --danger-bg: #fef3f2;
  --caution: #b54708;
  --caution-bg: #fffaeb;
  --safe: #067647;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0a0b0d;
    --surface: #16181c;
    --card: #1c1f24;
    --fg: #f2f4f7;
    --muted: #9aa3ad;
    --faint: #6b7280;
    --hairline: #262a31;
    --accent: #f46d50;
    --danger: #f97066;
    --danger-bg: #2d1512;
    --caution: #fdb022;
    --caution-bg: #2b1f0a;
    --safe: #47cd89;
  }
}

[data-theme='dark'] {
  --bg: #0a0b0d;
  --surface: #16181c;
  --card: #1c1f24;
  --fg: #f2f4f7;
  --muted: #9aa3ad;
  --faint: #6b7280;
  --hairline: #262a31;
  --accent: #f46d50;
  --danger: #f97066;
  --danger-bg: #2d1512;
  --caution: #fdb022;
  --caution-bg: #2b1f0a;
  --safe: #47cd89;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* --- gallery chrome ------------------------------------------------------- */

.gallery-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--hairline);
}

.gallery-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
.gallery-head .sub { margin: 0; color: var(--muted); font-size: 13px; }
.gallery-head .spacer { flex: 1; }

.toggle {
  padding: 7px 13px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 26px;
  padding: 26px 20px 60px;
  align-items: start;
}

.case { min-width: 0; }

.case-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0 0 10px 2px;
  font-size: 13px;
  color: var(--muted);
}

.case-code {
  font: 600 12px var(--mono);
  color: var(--accent);
}

.case-level {
  margin-left: auto;
  padding: 2px 8px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  font-size: 11px;
  color: var(--faint);
}

/* --- the sheet ------------------------------------------------------------ */

.sheet {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 20px;
  padding: 14px 18px 18px;
  overflow: hidden;
}

.grabber {
  width: 36px;
  height: 4px;
  margin: 0 auto 14px;
  border-radius: 99px;
  background: var(--hairline);
}

.sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sheet-identity { flex: 1; min-width: 0; }
.dapp-name { font-weight: 600; }
.dapp-origin { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

.avatar {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 50%;
  background: color-mix(in srgb, var(--tone, #8a93a5) 18%, transparent);
  color: var(--tone, #8a93a5);
  font-size: 14px;
  font-weight: 600;
}

.signer-who .avatar { width: 22px; height: 22px; font-size: 11px; }

.chain-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.chain-dot {
  width: 18px;
  height: 18px;
  flex: none;
  border-radius: 50%;
  background: #627eea;
}

.intent-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.tone-danger, .tone-hard-danger { color: var(--danger); }
.tone-caution { color: var(--caution); }
.tone-safe { color: var(--safe); }

/* hero */

.hero-amount { margin-bottom: 6px; }

.amount-line {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.amount {
  font-size: 32px;
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.amount-danger { color: var(--danger); }
.amount-symbol { font-size: 17px; color: var(--muted); }
.amount-fiat { margin-top: 2px; color: var(--faint); font-size: 13px; }
.amount-note { margin-top: 4px; color: var(--caution); font-size: 12px; }

.token-chip {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--tone, #8a93a5) 20%, transparent);
  color: var(--tone, #8a93a5);
  font-size: 11px;
  font-weight: 700;
}

.hero-call { margin-bottom: 4px; }
.call-name { font: 600 17px var(--mono); }
.call-contract { color: var(--muted); font-size: 13px; }

.hero-siwe { margin-bottom: 4px; }
.siwe-domain { font-size: 22px; font-weight: 600; }
.siwe-domain.bad { color: var(--danger); }
.siwe-statement { color: var(--muted); font-size: 13px; margin-top: 2px; }

.block {
  margin: 6px 0 0;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 12px;
  font: 12px/1.7 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.block-message { font-family: inherit; font-size: 13px; line-height: 1.6; }

.sentence {
  margin: 12px 0 0;
  font-size: 14px;
  line-height: 1.6;
}

/* rows */

.rows { margin-top: 14px; }

.row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 7px 0;
}

.row-label { color: var(--muted); font-size: 13px; flex: none; }
.row-value { text-align: right; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.row-sub { color: var(--faint); font-size: 12px; }
.row-warn .row-value { color: var(--danger); }
.strong { font-weight: 600; }
.danger { color: var(--danger); }
.neg { color: var(--fg); }
.pos { color: var(--safe); }
.mono { font-family: var(--mono); font-size: 12px; }

.identity-name { font-weight: 600; }
.identity-address { color: var(--faint); font: 12px var(--mono); }

.tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  color: var(--muted);
  font-size: 11px;
  vertical-align: middle;
}

.tag-bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* legs, balance, warnings */

.leg {
  margin-top: 10px;
  padding: 12px 14px;
  border: 1px solid var(--hairline);
  border-radius: 14px;
}

.leg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.leg-index { color: var(--muted); font-size: 13px; }

.balance {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 14px;
}

.balance-title { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.balance-note { color: var(--faint); font-size: 12px; margin-top: 4px; }

.warning {
  display: flex;
  gap: 9px;
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.55;
}

.warning-danger { background: var(--danger-bg); color: var(--danger); }
.warning-caution { background: var(--caution-bg); color: var(--caution); }
.warning-mark { flex: none; }

/* technical details */

.tech {
  margin-top: 14px;
  border-top: 1px solid var(--hairline);
  padding-top: 12px;
}

.tech-summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  list-style: none;
}

.tech-summary::marker, .tech-summary::-webkit-details-marker { display: none; }
.tech-summary::before { content: '› '; }
.tech[open] .tech-summary::before { content: '⌄ '; }

.tech-body {
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 14px;
}

.tech-label { color: var(--caution); font-size: 12px; margin: 10px 0 4px; }
.tech-label:first-child { margin-top: 0; }
.tech-signature { display: block; font: 12px/1.6 var(--mono); overflow-wrap: anywhere; }
.tech-sim { font-size: 13px; }

.address-card {
  margin: 6px 0;
  padding: 8px 10px;
  background: var(--surface);
  border-radius: 10px;
}

.address-role { color: var(--muted); font-size: 12px; }
.address-full { font-size: 11px; overflow-wrap: anywhere; }

.tech-raw {
  margin: 0;
  font: 11px/1.7 var(--mono);
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* fee, signer, slider */

.fee, .fee-wrap { margin-top: 14px; }

.fee {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: var(--card);
  border-radius: 12px;
  font-size: 13px;
}

.fee-wrap .fee { margin-top: 0; }
.fee-label { color: var(--muted); }
.fee-value { margin-left: auto; }
.fee-chevron { color: var(--faint); }
.fee-off .fee-value { color: var(--muted); }

.fee-note {
  margin-top: 6px;
  padding: 0 4px;
  color: var(--faint);
  font-size: 12px;
}

.fee-locked {
  padding: 2px 8px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  color: var(--faint);
  font-size: 11px;
}

.fee-options {
  margin-top: 8px;
  border: 1px solid var(--hairline);
  border-radius: 12px;
  overflow: hidden;
}

.fee-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--hairline);
  font-size: 13px;
}

.fee-option:last-child { border-bottom: 0; }
.fee-option.selected { background: var(--card); }
.fee-option-text { flex: 1; }
.fee-option-symbol { font-weight: 600; }
.fee-option-balance { color: var(--faint); font-size: 12px; }
.fee-option-cost { color: var(--muted); }
.fee-option-check { color: var(--accent); }

.signer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 13px;
}

.signer-label { color: var(--muted); }
.signer-who { display: inline-flex; align-items: center; gap: 7px; }

.slide {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 14px;
  height: 56px;
  padding: 6px;
  border-radius: 999px;
  background: var(--card);
}

.slide-knob {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 17px;
}

.slide-label {
  flex: 1;
  text-align: center;
  margin-right: 44px;
  color: var(--muted);
  font-size: 14px;
}

.slide-off .slide-knob { opacity: 0.45; }
.slide-off .slide-label { opacity: 0.6; }

/* the self-check strip */

.selfcheck {
  margin: 0 20px 40px;
  padding: 14px 18px;
  border: 1px solid var(--hairline);
  border-radius: 14px;
  background: var(--surface);
  font: 12px/1.8 var(--mono);
  color: var(--muted);
}

.selfcheck b { color: var(--safe); }

/* --- the signing entry ------------------------------------------------------ */

.signing-body { background: var(--bg); }

.stage {
  max-width: 460px;
  margin: 0 auto;
  padding: 28px 18px 40px;
}

.stage-status {
  margin: 16px 4px 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}

.pairing-code {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding: 10px 14px;
  background: var(--card);
  border-radius: 12px;
  font-size: 13px;
  color: var(--muted);
}

.pairing-code b {
  font: 600 26px/1 var(--mono);
  letter-spacing: 0.2em;
  color: var(--fg);
}

/* --- key ceremonies and the session between requests (spec 075) --------- */

.hero-ceremony {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 14px 0 4px;
  padding: 14px;
  background: var(--card);
  border-radius: 14px;
}

.ceremony-glyph {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-size: 22px;
  line-height: 1;
}

.ceremony-title {
  font-size: 20px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.challenge-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.tech-note { margin-top: 4px; color: var(--muted); font-size: 12px; }

.sheet-waiting .waiting-title {
  margin-top: 18px;
  font-size: 18px;
  font-weight: 600;
}

.sheet-waiting .waiting-note { color: var(--muted); }
.sheet-waiting.sheet-ended .waiting-title { color: var(--muted); }

.slide-knob { touch-action: none; cursor: grab; }
.slide-knob:active { cursor: grabbing; }
.slide:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.slide-label { transition: opacity 120ms linear; }

.identicon { display: inline-block; flex: none; vertical-align: middle; }
.identicon svg { width: 100%; height: 100%; display: block; border-radius: 50%; }

.identity { display: inline-flex; align-items: center; gap: 8px; }
.identity-text { display: flex; flex-direction: column; align-items: flex-end; }
.identity-name { font-weight: 600; }
.identity-address { color: var(--faint); font: 12px var(--mono); }

.avatar-logo { overflow: hidden; padding: 0; }
.avatar-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

.signer-who { display: inline-flex; align-items: center; gap: 8px; }
.signer-address { font: 12px var(--mono); color: var(--fg); }

.identity-wrap { display: inline-block; text-align: right; }

.identity {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 2px 4px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.identity:hover { background: var(--card); }
.identity.open .identity-more { transform: rotate(180deg); }
.identity-more { color: var(--faint); font-size: 11px; transition: transform 120ms ease; }
.row-tag { margin-bottom: 2px; }

.address-open[hidden] { display: none; }

.address-open {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 8px;
  padding: 14px;
  background: var(--card);
  border-radius: 14px;
  text-align: left;
}

.address-open .identicon { flex: none; }

.address-full-text {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 8px;
  font: 13px/1.7 var(--mono);
  overflow-wrap: anywhere;
}

.address-group { letter-spacing: 0.04em; }
.signer-text { display: inline-flex; flex-direction: column; align-items: flex-end; }
.signer-name { font-weight: 600; }
.token-chip.has-logo, .chain-dot.has-logo { background: transparent; overflow: hidden; }
.token-chip img, .chain-dot img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.chain-dot { overflow: hidden; }

.signer { align-items: flex-start; }
.signer .identity-wrap { flex: 1; }
.signer-label { padding-top: 6px; }

.address-side { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }

.address-full-text {
  font: 13px/1.6 var(--mono);
  letter-spacing: 0.02em;
  overflow-wrap: anywhere;
}

.copy-button {
  padding: 6px 12px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.copy-button:hover { background: var(--card); }

.balance-claimed { margin-top: 6px; color: var(--caution); font-size: 12px; }
</style>

// Translation, ~50 lines, no dependencies.
//
// Nothing in resolve.js produces a human-readable string. It produces keys and
// parameters; only this file turns them into words. That is what makes the
// wording auditable in one place, and a new locale one plain object.
window.VelaCS = window.VelaCS || {};
(function (ns) {
  'use strict';

  var catalogs = {};
  var current = 'zh';

  function register(locale, entries) {
    catalogs[locale] = entries;
  }

  function available() {
    return Object.keys(catalogs);
  }

  /** Pick a locale: explicit override → stored choice → browser → zh. */
  function detect(override) {
    if (override && catalogs[override]) return override;
    try {
      var stored = localStorage.getItem('clearsigning.locale');
      if (stored && catalogs[stored]) return stored;
    } catch (e) { /* storage can be blocked */ }
    var tags = (navigator.languages || [navigator.language || 'zh']).map(String);
    for (var i = 0; i < tags.length; i++) {
      var tag = tags[i].toLowerCase();
      if (catalogs[tag]) return tag;
      var base = tag.split('-')[0];
      if (catalogs[base]) return base;
    }
    return 'zh';
  }

  function setLocale(locale) {
    if (!catalogs[locale]) return current;
    current = locale;
    try {
      localStorage.setItem('clearsigning.locale', locale);
    } catch (e) { /* ignore */ }
    document.documentElement.setAttribute('lang', locale);
    return current;
  }

  /**
   * t('sentence.transfer', { amount: '1,000 USDC', to: 'Alice Chen' })
   *
   * A missing key returns the key itself rather than an empty string: a hole in
   * a signing prompt must be loud, never invisible.
   */
  function t(key, params) {
    if (key === null || key === undefined) return '';
    if (typeof key === 'object') return t(key.key, key.params);
    var entry = (catalogs[current] && catalogs[current][key]);
    if (entry === undefined) entry = (catalogs.en && catalogs.en[key]);
    if (entry === undefined) return key;
    if (!params) return entry;
    return entry.replace(/\{(\w+)\}/g, function (whole, name) {
      return params[name] === undefined ? whole : String(params[name]);
    });
  }

  ns.i18n = {
    register: register,
    available: available,
    detect: detect,
    setLocale: setLocale,
    get locale() { return current; },
    t: t,
  };
})(window.VelaCS);

// Keccak-256, ~80 lines, no dependencies.
//
// It is here for one reason: a descriptor that claims selector 0xa9059cbb means
// `transfer(address,uint256)` must be checkable, not trusted. Without this the
// whole point of the page collapses — a poisoned descriptor could label any
// call anything it liked and the rendering would faithfully lie.
window.VelaCS = window.VelaCS || {};
(function (ns) {
  'use strict';

  var MASK = (1n << 64n) - 1n;

  var ROT = [
    0, 1, 62, 28, 27,
    36, 44, 6, 55, 20,
    3, 10, 43, 25, 39,
    41, 45, 15, 21, 8,
    18, 2, 61, 56, 14,
  ];

  var RC = [
    0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
    0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
    0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
    0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
    0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
    0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
  ];

  function rotl(x, n) {
    var b = BigInt(n);
    if (b === 0n) return x;
    return ((x << b) | (x >> (64n - b))) & MASK;
  }

  function permute(A) {
    for (var round = 0; round < 24; round++) {
      var C = [0n, 0n, 0n, 0n, 0n];
      var x, y;
      for (x = 0; x < 5; x++) C[x] = A[x] ^ A[x + 5] ^ A[x + 10] ^ A[x + 15] ^ A[x + 20];
      for (x = 0; x < 5; x++) {
        var D = C[(x + 4) % 5] ^ rotl(C[(x + 1) % 5], 1);
        for (y = 0; y < 25; y += 5) A[x + y] = A[x + y] ^ D;
      }
      var B = new Array(25).fill(0n);
      for (x = 0; x < 5; x++) {
        for (y = 0; y < 5; y++) {
          B[y + 5 * ((2 * x + 3 * y) % 5)] = rotl(A[x + 5 * y], ROT[x + 5 * y]);
        }
      }
      for (y = 0; y < 25; y += 5) {
        for (x = 0; x < 5; x++) {
          A[x + y] = B[x + y] ^ ((~B[((x + 1) % 5) + y] & MASK) & B[((x + 2) % 5) + y]);
        }
      }
      A[0] = A[0] ^ RC[round];
    }

  /** keccak256 over bytes → 32-byte Uint8Array. */
  function keccak256(input) {
    var rate = 136;
    var padded = new Uint8Array(Math.ceil((input.length + 1) / rate) * rate);
    padded.set(input, 0);
    padded[input.length] = 0x01;
    padded[padded.length - 1] |= 0x80;

    var A = new Array(25).fill(0n);
    for (var offset = 0; offset < padded.length; offset += rate) {
      for (var i = 0; i < rate / 8; i++) {
        var lane = 0n;
        for (var b = 7; b >= 0; b--) lane = (lane << 8n) | BigInt(padded[offset + i * 8 + b]);

      }
      permute(A);
    }

    var out = new Uint8Array(32);
    for (var w = 0; w < 4; w++) {
      var lane2 = A[w];
      for (var k = 0; k < 8; k++) {
        out[w * 8 + k] = Number((lane2 >> BigInt(8 * k)) & 0xffn);
      }

  }

    var s = '';
    for (var i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');

    hash: keccak256,

    selector: function (signature) {
      return hex(keccak256(new TextEncoder().encode(signature))).slice(0, 10);
    },
  };

        view.risk = 'danger';
        view.sentence = text('sentence.burn');
        view.warnings.push({ tone: 'danger', key: 'warn.burn' });
        view.refuse = true;
      } else if (row.identity.kind === 'own') {
        view.risk = 'safe';
      }
    });
  }

  function sentenceFor(descriptor, rows, meta, view) {
    var send = rows.find(function (r) { return r.amount && r.role === 'send-amount'; });
    var to = rows.find(function (r) { return r.identity && (r.role === 'recipient' || r.role === 'spender'); });
    var kind = descriptor.kind;

    if (kind === 'nftTransfer') {
      return text('sentence.nftTransfer', {
        collection: label(meta),
        id: view.hero && view.hero.id,
        to: to ? label(to.identity) : '—',
      });
    }
    if (!send) {
      if (kind === 'approve') {
        var cap = rows.find(function (r) { return r.amount; });
        if (cap && to) {
          return cap.amount.unlimited
            ? text('sentence.approveUnlimited', { spender: label(to.identity), symbol: cap.amount.symbol })
            : text('sentence.approve', { spender: label(to.identity), amount: amountPhrase(cap.amount) });
        }
      }
      return null;
    }
    var amount = amountPhrase(send.amount);
    if (kind === 'transfer' || kind === 'transferFrom') {
      return text('sentence.transfer', { amount: amount, to: to ? label(to.identity) : '—' });
    }
    if (kind === 'swap') {
      var receive = rows.find(function (r) { return r.role === 'receive-amount'; });
      return text('sentence.swap', { amount: amount, receive: receive ? amountPhrase(receive.amount) : '—' });
    }
    if (kind === 'vaultDeposit') return text('sentence.vaultDeposit', { amount: amount, vault: label(meta) });
    if (kind === 'vaultWithdraw') return text('sentence.vaultWithdraw', { amount: amount, vault: label(meta) });
    return null;
  }

  // --- nested calldata -------------------------------------------------------

  function applyNested(descriptor, values, call, ctx, view, meta) {
    var inner = descriptor.nested === 'multiSend'
      ? decodeMultiSend(values[0])
      : [{ to: values[0], value: values[1], data: values[2] }];
    view.hero = null;
    view.legs = inner.map(function (leg, i) {
      var legView = baseView(null, ctx);
      resolveCall({ to: leg.to, value: '0x' + BigInt(leg.value || 0n).toString(16), data: leg.data }, ctx, legView, true);
      return { index: i + 1, view: legView };
    });
    view.risk = view.legs.reduce(function (worst, leg) {
      return rank(leg.view.risk) > rank(worst) ? leg.view.risk : worst;
    }, rank(view.risk) > rank('caution') ? view.risk : 'caution');
    // OR, never overwrite: a refusal decided before the legs were read (the
    // operation does not hold what was asked) must survive them.
    view.refuse = view.refuse || view.legs.some(function (leg) { return leg.view.refuse; });
    view.sentence = descriptor.nested === 'multiSend'
      ? text('sentence.multiSend', { count: inner.length })
      : text('sentence.safeExec');
    view.warnings.push({ tone: 'caution', key: 'warn.nested' });
    view.tech = techFor(descriptor.signature, values, call.data, {
      addresses: [{ roleKey: 'ui.outerContract', name: label(meta), address: call.to }],
    });
    return view;
  }

  // Safe's multiSend packs legs as: operation(1) ‖ to(20) ‖ value(32) ‖ len(32) ‖ data
  function decodeMultiSend(packed) {
    var body = abi.strip(packed);
    var legs = [];
    var i = 0;
    while (i + 170 <= body.length) {
      var length = Number(BigInt('0x' + body.slice(i + 106, i + 170)));
      legs.push({
        to: '0x' + body.slice(i + 2, i + 42),
        value: BigInt('0x' + body.slice(i + 42, i + 106)),
        data: '0x' + body.slice(i + 170, i + 170 + length * 2),
      });
      i += 170 + length * 2;
    }
    return legs;
  }

  // --- messages --------------------------------------------------------------

  function hexToText(hex) {
    var body = abi.strip(hex);
    var bytes = new Uint8Array(body.length / 2);
    for (var i = 0; i < bytes.length; i++) bytes[i] = parseInt(body.substr(i * 2, 2), 16);
    try {
      var decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      // Control characters (tab/newline/CR excepted) mean these are not words.
      return UNREADABLE.test(decoded) ? null : decoded;
    } catch (e) {
      return null;
    }
  }

  function isHexPayload(payload) {
    if (typeof payload !== 'string' || !payload.startsWith('0x')) return false;
    var body = payload.slice(2);
    return body.length % 2 === 0 && /^[0-9a-fA-F]*$/.test(body);
  }

  function parseSiwe(body) {
    var lines = body.split('\n');
    var m = lines[0].match(/^(\S+) wants you to sign in with your Ethereum account:$/);
    if (!m) return null;
    return {
      domain: m[1],
      address: lines[1] || '',
      statement: lines[3] || '',
      nonce: (body.match(/^Nonce: (.*)$/m) || [])[1] || '',
    };
  }

  function resolvePersonalSign(intent, ctx, view) {
    var payload = intent.params[0];
    var body = isHexPayload(payload) ? hexToText(payload) : payload;
    view.fee = null; // nothing is charged for an off-chain signature

    if (body === null) {
      view.intentKey = 'intent.signData';
      view.level = 4;
      view.risk = 'danger';
      view.hero = { kind: 'hash', hex: payload };
      view.sentence = text('sentence.hexData');
      view.warnings.push({ tone: 'danger', key: 'warn.hexData' });
      view.tech = techFor('personal_sign', null, payload, {});
      return view;
    }

    var siwe = parseSiwe(body);
    if (siwe) {
      var origin = (intent.origin || '').replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      var mismatch = siwe.domain.toLowerCase() !== origin.toLowerCase();
      view.intentKey = 'intent.login';
      view.hero = { kind: 'siwe', domain: siwe.domain, statement: siwe.statement, mismatch: mismatch };
      view.fields = [
        { label: 'field.claimedDomain', value: siwe.domain, format: 'raw', warning: mismatch },
        { label: 'field.actualSite', value: origin, format: 'raw', warning: mismatch },
        { label: 'field.nonce', value: siwe.nonce, format: 'raw', detail: true },
      ];
      if (mismatch) {
        view.risk = 'danger';
        view.sentence = text('sentence.siwePhish', { claimed: siwe.domain, actual: origin });
        view.warnings.push({ tone: 'danger', key: 'warn.siweMismatch' });
      } else {
        view.risk = 'safe';
        view.sentence = text('sentence.siweOk', { domain: siwe.domain });
      }
      view.tech = techFor('personal_sign (SIWE)', null, payload, {});
      return view;
    }

    view.intentKey = 'intent.message';
    view.hero = { kind: 'message', text: body };
    view.sentence = text('sentence.message');
    view.tech = techFor('personal_sign (UTF-8)', null, payload, {});
    return view;
  }

  function resolveEthSign(intent, ctx, view) {
    view.intentKey = 'intent.blind';
    view.risk = 'hard-danger';
    view.level = 6;
    view.fee = null; // nothing is charged for an off-chain signature
    view.hero = { kind: 'hash', hex: intent.params[1] || intent.params[0] };
    view.sentence = text('sentence.ethSign');
    view.warnings.push({ tone: 'danger', key: 'warn.ethSign' });
    view.tech = techFor('eth_sign (raw 32-byte hash)', null, intent.params[1] || intent.params[0], {});
    return view;
  }

  function resolveTypedData(intent, ctx, view) {
    var raw = intent.params[1];
    var data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    var primary = data.primaryType;
    var message = data.message || {};
    var domain = data.domain || {};
    view.fee = null; // nothing is charged for an off-chain signature
    view.contract = identify(domain.verifyingContract || '', ctx);

    if (primary === 'Permit') {
      var amount = tokenAmount(BigInt(message.value), domain.verifyingContract, ctx);
      var spender = identify(message.spender, ctx);
      var deadline = Number(message.deadline);
      var expired = deadline * 1000 < (ctx.now || Date.now());
      view.intentKey = 'intent.permit';
      view.hero = { kind: 'amount', amount: amount, direction: 'allowance' };
      view.fields = [
        { label: 'field.spender', identity: spender, format: 'addressName', role: 'spender' },
        { label: 'field.validUntil', value: formatDate(deadline), format: 'date', expired: expired },
        { label: 'field.token', value: amount.token.name || amount.symbol, format: 'raw' },
      ];
      view.sentence = text('sentence.permit', {
        spender: label(spender),
        deadline: formatDate(deadline),
        amount: amountPhrase(amount),
      });
      // An unlimited permit is signable as it arrived, like the wallet's own
      // sheet signs one (owner, 2026-09-26): the dApp redeems its own struct,
      // so a capped signature would only fail on-chain. Red, and said.
      if (amount.unlimited) {
        view.risk = 'danger';
        view.warnings.push({ tone: 'danger', key: 'warn.unlimitedOffline' });
      } else {
        view.risk = 'caution';
        view.warnings.push({ tone: 'caution', key: 'warn.offchainNoTrace' });
      }
      if (expired) view.warnings.push({ tone: 'caution', key: 'warn.expired' });
      view.tech = techFor('EIP-712 · ' + primary, null, null, {
        params: Object.keys(message).map(function (k) { return { name: k, value: renderRaw(message[k]) }; }),
        addresses: [{ roleKey: 'ui.verifyingContract', name: label(view.contract), address: domain.verifyingContract }],
      });
      return view;
    }

    if (primary === 'PermitSingle' || primary === 'PermitTransferFrom') {
      var details = message.details || message.permitted || {};
      var pAmount = tokenAmount(BigInt(details.amount), details.token, ctx);
      var pSpender = identify(message.spender, ctx);
      view.intentKey = 'intent.permit2';
      view.hero = { kind: 'amount', amount: pAmount, direction: 'allowance' };
      view.fields = [
        { label: 'field.spender', identity: pSpender, format: 'addressName', role: 'spender' },
        { label: 'field.token', value: pAmount.token.name || pAmount.symbol, format: 'raw' },
        { label: 'field.validUntil', value: formatDate(details.expiration || message.deadline), format: 'date' },
      ];
      view.risk = pAmount.unlimited ? 'danger' : 'caution';
      view.sentence = pAmount.unlimited
        ? text('sentence.permit2Unlimited', { spender: label(pSpender), symbol: pAmount.symbol })
        : text('sentence.permit2Limited', { spender: label(pSpender), amount: amountPhrase(pAmount) });
      // Uniswap's own Permit2 signatures are usually for the uint160 maximum;
      // refusing them here broke swaps the wallet's sheet signs (2026-09-26).
      if (pAmount.unlimited) {
        view.warnings.push({ tone: 'danger', key: 'warn.unlimitedOffline' });
      }
      view.tech = techFor('EIP-712 · ' + primary, null, null, {
        params: [
          { name: 'token', value: details.token },
          { name: 'amount', value: String(details.amount) },
          { name: 'spender', value: message.spender },
          { name: 'expiration', value: String(details.expiration || message.deadline) },
        ],
        addresses: [{ roleKey: 'ui.verifyingContract', name: 'Permit2', address: domain.verifyingContract }],
      });
      return view;
    }

    view.intentKey = 'intent.typed';
    view.level = 2;
    view.risk = 'caution';
    view.hero = { kind: 'code', title: primary, sub: domain.name || null };
    view.fields = Object.keys(message).map(function (key) {
      return { labelRaw: key, value: renderRaw(message[key]), format: 'raw' };
    });
    view.sentence = text('sentence.typedUnknown', { type: primary });
    view.warnings.push({ tone: 'caution', key: 'warn.typedUnknown' });
    view.tech = techFor('EIP-712 · ' + primary, null, null, {
      params: Object.keys(message).map(function (k) { return { name: k, value: renderRaw(message[k]) }; }),
      addresses: domain.verifyingContract
        ? [{ roleKey: 'ui.verifyingContract', name: label(view.contract), address: domain.verifyingContract }]
        : [],
    });
    return view;
  }

  // --- key ceremonies (spec 075) -----------------------------------------------
  //
  // The page is a passkey route of its own, so besides signing intents it takes
  // four requests a Vela wallet builds for its own flows: create a key, sign
  // in, prove a key (verify / recover), and confirm a key's membership in the
  // registry. Each gets its own card. The challenge each one signs is derived
  // by the page (lib/ceremony.js) — a request that tries to hand one over is
  // refused outright, because a "sign-in" over bytes the requester chose could
  // be a transaction hash in disguise.

  // A 16-byte-or-longer credential id, base64url, as the page's wire carries it.
  var CREDENTIAL_ID = /^[A-Za-z0-9_-]{16,1400}$/;
  var P256_POINT = /^(0x)?04[0-9a-fA-F]{128}$/;
  /** A 20-byte contract address, `0x`-prefixed as the wallet sends it. */
  var ADDRESS = /^0x[0-9a-fA-F]{40}$/;
  var LOOPBACK_HOST = /^(localhost|127\.0\.0\.1|\[::1\])$/;

  function hostOf(url) {
    try { return new URL(url).hostname.toLowerCase(); } catch (e) { return ''; }
  }

  function schemeOf(url) {
    try { return new URL(url).protocol; } catch (e) { return ''; }
  }

  /** The scheme a Vela wallet's answer goes back on (`trusted_signer::CALLBACK_URL`). */
  var WALLET_SCHEME = 'velawallet:';

  /**
   * Is the requester a Vela wallet? Three kinds of evidence count:
   *
   *  · an app channel: the loopback WebSocket (the app that opened this page
   *    proved it with its one-time token), the tunnel (the wallet's key matches
   *    the link's `rk`, and the person compares the code), BLE (proximity and
   *    the code) — all retired, kept because the shape of the rule is theirs;
   *  · an origin the BROWSER vouches for (postMessage)
   *    that is https://getvela.app or a subdomain — or this machine's loopback,
   *    where the web wallet runs in development and in tests;
   *  · **where the answer is going.** On the URL channel — now the only one the
   *    clients have — nothing can tell this page who opened it, and a fragment
   *    is no evidence: any site can open this page with one. But the page does
   *    know the address it will send the answer to, because sending it is what
   *    the page will do. If that address is the wallet's own scheme, then
   *    whoever asked, the answer reaches a Vela wallet and nobody else.
   *
   * Why that is protection and not a rubber stamp: somebody who wants the key
   * this page creates has to RECEIVE it, so they have to name a callback they
   * can receive on. Name the wallet's scheme and the key goes to the wallet,
   * which is no use to them; name their own and this returns false. The way
   * round it is to register `velawallet://` on the device and win the
   * collision — which is precisely the limit the transport documents, and
   * which no page can do anything about (`trusted_signer::CALLBACK_URL`).
   *
   * Note what this does NOT claim: not that Vela asked, only that Vela
   * answers. The card says it in those words, because that is the true one.
   */
  function walletRequester(ctx) {
    if (ctx.channel === 'ws' || ctx.channel === 'relay' || ctx.channel === 'ble') return true;
    if (ctx.channel === 'url') return answersToWallet(ctx);
    if (ctx.originVerified !== true || typeof ctx.requester !== 'string') return false;
    var host = hostOf(ctx.requester);
    if (LOOPBACK_HOST.test(host)) return true;
    return schemeOf(ctx.requester) === 'https:' && (host === 'getvela.app' || /\.getvela\.app$/.test(host));
  }

  /** Will this request's answer go to a Vela wallet on this device? */
  function answersToWallet(ctx) {
    return schemeOf(ctx.callback) === WALLET_SCHEME;
  }

  // Anything that could be the bytes to sign, anywhere the requester controls:
  // the context, a second parameter, a non-object first one, or a field of it.
  function suppliedChallenge(intent, ctx) {
    if (ctx.challenge !== undefined || ctx.digest !== undefined) return true;
    var params = Array.isArray(intent.params) ? intent.params : [];
    if (params.length > 1) return true;
    var first = params[0];
    if (first === undefined || first === null) return false;
    if (typeof first !== 'object' || Array.isArray(first)) return true;
    return ['challenge', 'digest', 'hash', 'message'].some(function (name) {
      return Object.prototype.hasOwnProperty.call(first, name);
    });
  }

  // A name a person gave their wallet: shown, because it is how they recognise
  // it, but only if it is readable text of a sane length.
  function displayName(value) {
    if (typeof value !== 'string') return null;
    var trimmed = value.trim();
    if (!trimmed || trimmed.length > 64 || UNREADABLE.test(trimmed)) return null;
    // Bidirectional overrides can make a name read as something else.
    if (/[‪-‮⁦-⁩]/.test(trimmed)) return null;
    return trimmed;
  }

  function registryUrl(value) {
    if (value === undefined || value === null || value === '') return ns.ceremony.DEFAULT_REGISTRY;
    if (typeof value !== 'string') return null;
    var scheme = schemeOf(value);
    var host = hostOf(value);
    if (scheme === 'https:' && host) return value.replace(/\/+$/, '');
    if (scheme === 'http:' && LOOPBACK_HOST.test(host)) return value.replace(/\/+$/, '');
    return null;
  }

  function shortKey(hexKey) {
    var body = String(hexKey).replace(/^0x/i, '').toLowerCase();
    return body.slice(0, 8) + '…' + body.slice(-6);
  }

  // Who is asking, in words the person can check: the verified site, where the
  // answer will go, or the kind of channel the request came over.
  function requesterLine(ctx) {
    if (ctx.originVerified === true && ctx.requester) {
      return { origin: hostOf(ctx.requester) || ctx.requester, verified: true };
    }
    if (ctx.channel === 'url') {
      // Say the destination, not a name. The page cannot know who opened it,
      // and a self-reported name beside a mark reads as an identity the page
      // checked (owner, 2026-09-24: the page answers a `velawallet://` and
      // nothing else, so 「某个钱包」 and its logo were both inappropriate).
      return answersToWallet(ctx)
        ? { originKey: 'value.answerToThisWallet', verified: true }
        : { origin: schemeOf(ctx.callback) || null, originKey: schemeOf(ctx.callback) ? null : 'value.answerToNobody', verified: false, elsewhere: true };
    }
    var byChannel = { ws: 'value.viaApp', relay: 'value.viaTunnel', ble: 'value.viaBle' }[ctx.channel];
    return { originKey: byChannel || 'value.viaUnknown', verified: false };
  }

  /**
   * A stable colour for a name nobody verified: the same name always gets the
   * same one, and two different names almost never collide. Hues only, at one
   * saturation and lightness, so every unverified peer reads as the same KIND
   * of thing — a stranger who told us a name — and never as a brand.
   */
  function toneFor(name) {
    var text = String(name || '');
    var hash = 0;
    for (var i = 0; i < text.length; i++) {
      hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
    }
    return 'hsl(' + (Math.abs(hash) % 360) + ', 34%, 46%)';
  }

  function resolveCeremony(kind, intent, ctx, view) {
    var p = (Array.isArray(intent.params) && intent.params[0]) || {};
    if (typeof p !== 'object' || Array.isArray(p)) p = {};
    var wallet = displayName(ctx.walletName);
    var rpId = ctx.rpId || null;
    var fromWallet = walletRequester(ctx);
    var bad = intent.params !== undefined && !Array.isArray(intent.params);
    /** A member proof whose request names no chain or registry contract. */
    var noDeployment = false;

    view.kind = 'ceremony';
    view.intentKey = 'intent.' + kind;
    view.risk = 'normal';
    view.level = 1;
    view.account = null;
    view.ceremony = { kind: kind, walletName: wallet, fromWallet: fromWallet };

    // The head names whoever is asking — and only wears Vela's mark when the
    // channel vouches for it.
    //
    // This page is a signer anything can connect to: over BLE or the tunnel the
    // requester is whatever dialled in, and its hello's `app` is a CLAIM. The
    // page already refuses to launder a dApp's self-reported name into a
    // verified one; painting Vela's V and "Vela 钱包" on an unverified peer was
    // the same laundering one layer up, and the louder one, because the mark
    // is what a person reads before deciding to trust the screen.
    var who = requesterLine(ctx);
    var claimed = typeof ctx.requesterApp === 'string' ? ctx.requesterApp.trim().slice(0, 40) : '';
    view.dapp.name = null;
    view.dapp.nameKey = 'tag.velaWallet';
    view.dapp.letter = 'V';
    view.dapp.tone = '#ff6a1a';
    view.dapp.icon = null;
    if (who.elsewhere) {
      // The answer is going somewhere that is not a Vela wallet. Say the
      // destination and nothing else: no name, no mark, nothing borrowed from
      // whoever asked. The ceremony rules refuse this case anyway; the card's
      // job is to make the reason readable.
      view.dapp.name = null;
      view.dapp.nameKey = 'tag.notThisWallet';
      view.dapp.letter = '?';
      view.dapp.tone = toneFor(String(ctx.callback || ''));
    } else if (!who.verified) {
      // A name it gave for itself, said as such; otherwise no name at all.
      //
      // The mark is a monogram in a colour DERIVED from that name, never an
      // image the peer sent. A logo is the strongest thing a person reads
      // before trusting a screen and the easiest to forge — hand the peer a
      // picture slot and an impostor simply sends Vela's. Derived, the mark is
      // a fingerprint of the name that is printed right next to it: to look
      // the same, something has to BE called the same.
      view.dapp.name = claimed || null;
      view.dapp.nameKey = claimed ? null : 'tag.someWallet';
      view.dapp.nameClaimed = !!claimed;
      view.dapp.letter = (claimed || '?').slice(0, 1).toUpperCase();
      view.dapp.tone = toneFor(claimed);
      // The mark it sent for itself, if it sent one the transport allowed
      // (inline, raster, small). Drawn beside the line that says both the
      // name and the mark are its own claim — this channel cannot check
      // either, and the page must not look like it did.
      view.dapp.icon = typeof ctx.requesterIcon === 'string' && ctx.requesterIcon
        ? ctx.requesterIcon
        : null;
    }
    view.dapp.origin = who.origin || null;
    view.dapp.originKey = who.originKey || null;
    view.dapp.originVerified = who.verified;

    view.hero = { kind: 'ceremony', ceremony: kind, title: wallet, titleKey: wallet ? null : 'value.yourWallet' };
    if (wallet) view.fields.push({ label: 'field.wallet', value: wallet });

    var params = [];
    if (kind === 'create') {
      var name = p.name === undefined ? (wallet || 'Vela') : displayName(p.name);
      var exclude = p.excludeCredentialIds === undefined ? [] : p.excludeCredentialIds;
      if (!name || !Array.isArray(exclude) || !exclude.every(function (id) {
        return typeof id === 'string' && CREDENTIAL_ID.test(id);
      })) bad = true;
      view.ceremony.name = name;
      view.ceremony.excludeCredentialIds = Array.isArray(exclude) ? exclude : [];
      view.sentence = text(wallet ? 'sentence.create' : 'sentence.createUnnamed', { wallet: wallet });
      if (name && name !== wallet) view.fields.push({ label: 'field.passkeyName', value: name });
      params.push({ name: 'challenge', valueKey: 'value.randomChallenge' });
      params.push({ name: 'pubKeyCredParams', value: 'ES256 (P-256)' });
      params.push({ name: 'residentKey', value: 'required' });
      params.push({ name: 'userVerification', value: 'required' });
      if (view.ceremony.excludeCredentialIds.length) {
        params.push({ name: 'excludeCredentials', value: String(view.ceremony.excludeCredentialIds.length) });
      }
    } else if (kind === 'signIn') {
      view.sentence = text('sentence.signIn');
      params.push({ name: 'allowCredentials', valueKey: 'value.anyKey' });
    } else if (kind === 'proof') {
      var purpose = p.purpose;
      if (!ns.ceremony.proofChallenge(purpose)) bad = true;
      if (p.credentialId !== undefined && !(typeof p.credentialId === 'string' && CREDENTIAL_ID.test(p.credentialId))) bad = true;
      view.ceremony.purpose = purpose;
      view.ceremony.credentialId = typeof p.credentialId === 'string' ? p.credentialId : null;
      view.intentKey = purpose === 'verify' ? 'intent.proofVerify' : 'intent.proofRecover';
      view.badge = purpose === 'recover_first' ? 'tag.stepOne' : purpose === 'recover_second' ? 'tag.stepTwo' : null;

      // signer anything can connect to, so painting Vela's mark on whatever
      // dialled in would be the page vouching for something it cannot check.
      requesterApp: session.requesterApp || '',
      requesterIcon: session.requesterIcon || '',
      // Where the answer will go. The channel's, never the requester's: it is
      // what this page will DO, and on the url channel it is the only thing
      // the page can say about the other end truthfully.
      callback: session.callback || '',
      rpId: ns.signer.relyingPartyId(),
    });
    var view = ns.resolve(request.intent, context);
    state.kind = view.kind === 'ceremony' ? view.ceremony.kind : 'sign';
    if (view.kind === 'ceremony') showCeremony(request, view, context);
    else showSigning(request, view, context);
  }

  function loop() {
    session.next().then(function (request) {
      if (request) show(request);
      else ended();
    });
  }

  // The session is over. Say why, in the page's own words.
  function ended() {
    state.endReason = session.endReason;
    window.__slider = null;
    if (session.endReason === 'single') return; // a one-shot channel: its answer's words stand
    try { closing(session.endReason); } finally { phase('ended'); }
  }

  function closing(reason) {
    if (reason === 'error') {
      say(session.endDetail || 'ui.walletGone');
      if (session.persistent) {
        waiting({ titleKey: 'ui.sessionEnded', noteKey: session.endDetail || 'ui.walletGone' });
        slot.firstChild.classList.add('sheet-ended');
      }
      return;
    }
    if (reason === 'idle') {
      say('ui.sessionIdle');
      waiting({ titleKey: 'ui.sessionEnded', noteKey: 'ui.sessionIdle' });
      slot.firstChild.classList.add('sheet-ended');
      return;
    }
    // bye, or the channel closed. A card whose wallet went away, or a
    // refusal, keeps its reasons on screen.
    if (lastGone) {
      say('ui.walletGone');
      return;
    }
    if (window.__refused) {
      say('ui.sessionOver');
      return;
    }
    if (session.answered) {
      say('ui.sessionDone');
      waiting({ titleKey: 'ui.sessionEnded', noteKey: 'ui.sessionDone' });
      slot.firstChild.classList.add('sheet-ended');
      return;
    }
    // Nothing was answered: the wallet stopped waiting (or never came).
    if (!slot.querySelector('.sheet') || slot.querySelector('.sheet-waiting')) say('ui.walletGone');
  }

  // Walking away is a refusal, and the requester deserves to hear it rather
  // than hang forever.
  window.addEventListener('pagehide', function () {
    if (current && !current.answered && !current.gone) {
      // `true` = we are unloading, so the answer must go out by beacon.
      try { current.reject(current.refusalCode || 'user_rejected', true); } catch (e) { /* best effort */ }
    }
  });

  say('ui.waitingRequest');

  /**
   * Start the session — but BLE first asks the person to press something.
   *
   * `navigator.bluetooth.requestDevice` refuses without user activation, so a
   * page that calls it on load cannot ever pair: the first radio pass (spec
   * 075 T043) found this page showing Chrome's own exception text where the
   * device chooser should have been. The button IS the gesture; nothing else
   * on this page needs one.
   */
  function startSession() {
    ns.intake
      .open({
      // The loopback socket is slow to open only when the browser is asking
      // the person first (Local Network Access).
      onWaiting: function () { say('ui.waitingWallet'); },
      // The wallet stopped waiting for the request on screen: signing now
      // would sign into nothing, so the slider goes.
      onGone: function (request) {
        if (request !== current) return;
        current = null;
        lastGone = true;
        var slider = slot.querySelector('.slide');
        if (slider) slider.classList.add('slide-off');
        window.__slider = null;
        say('ui.walletGone');
        phase('gone');
        // The session may carry on; listen again. `lose()` runs before a
        // session is marked ended, so wait a tick.
        setTimeout(loop, 0);
      },
    })
      .then(function (opened) {
        session = opened;
        state.channel = opened.channel;
        loop();
      })
      .catch(function (error) {
        say(String(error.message || error));
      });
  }

  startSession();
})(window.VelaCS);
</script>
  </body>
</html>
