<!doctype html>
<meta charset="utf-8" />
<title>Test dApp</title>
<body>
	<h1>Test dApp</h1>
	<!-- A REAL click: the one road to the side panel (a user gesture). -->
	<button id="connect" type="button">Connect</button>
	<button id="sign" type="button">Sign</button>
	<!-- Spec 081: the four shapes the self-call guard must refuse. A page can
	     ask for every one of them, so the test dApp can too. -->
	<button id="take-over" type="button">Add owner (blocked)</button>
	<button id="enable-module" type="button">Enable module (blocked)</button>
	<button id="batch-take-over" type="button">Batch with a self-call (blocked)</button>
	<button id="safe-tx" type="button">SafeTx typed data (blocked)</button>
	<pre id="out">waiting…</pre>
	<script>
		const out = document.getElementById('out');
		const state = { announced: [], legacy: null, results: {}, events: [] };
		const show = () => (out.textContent = JSON.stringify(state, null, 2));

		// EIP-6963: ask, and record every wallet that answers.
		window.addEventListener('eip6963:announceProvider', (ev) => {
			const { info, provider } = ev.detail;
			state.announced.push({
				uuid: typeof info.uuid,
				name: info.name,
				rdns: info.rdns,
				iconScheme: String(info.icon).slice(0, 15),
				sameAsWindowEthereum: provider === window.ethereum,
				frozenInfo: Object.isFrozen(info)
			});
			window.__velaProvider = provider;
			// Every EIP-1193 event the provider pushes, in order — what a dApp
			// reacts to. Hooked on the announce, so nothing is asked for twice.
			for (const event of ['accountsChanged', 'chainChanged', 'connect', 'disconnect']) {
				provider.on(event, (data) => {
					state.events.push({ event, data });
					show();
				});
			}
			show();
		});
		window.dispatchEvent(new Event('eip6963:requestProvider'));

		// The legacy singleton, as an old MetaMask-only dApp would find it.
		state.legacy = window.ethereum
			? {
					isMetaMask: window.ethereum.isMetaMask === true,
					isVela: window.ethereum.isVela === true,
					hasRequest: typeof window.ethereum.request === 'function',
					hasEnable: typeof window.ethereum.enable === 'function',
					hasSendAsync: typeof window.ethereum.sendAsync === 'function'
				}
			: null;
		show();

		/**
		 * A hostile page's two cheapest tricks, driven by the test.
		 *
		 * `__forge` posts a message straight onto the channel claiming to be
		 * somebody else. `__replay` sends the same request id twice. Neither is
		 * exotic: both are what a page CAN do, so both have to be answers rather
		 * than assumptions.
		 */
		window.__forge = (origin) =>
			window.postMessage(
				{
					ch: 'vela-1193',
					dir: 'req',
					id: 'forged-1',
					method: 'eth_requestAccounts',
					params: [],
					origin
				},
				window.location.origin
			);

		// Driven by a person (or a trusted click): the gesture the side panel needs.
		document.getElementById('connect').addEventListener('click', () => {
			window.__ask('eth_requestAccounts');
		});
		document.getElementById('sign').addEventListener('click', () => {
			window.__ask('personal_sign', ['0x48656c6c6f2c2056656c61', window.ethereum.selectedAddress]);
		});

		/** Spec 081 fixtures: calls that would change who controls the account. */
		const wordAddr = (a) => a.replace(/^0x/, '').padStart(64, '0');
		const word = (n) => n.toString(16).padStart(64, '0');
		const selfAddress = () => window.ethereum.selectedAddress;
		const addOwnerData = () => `0x0d582f13${wordAddr(selfAddress())}${word(1)}`;
		const enableModuleData = () => `0x610b5925${wordAddr(selfAddress())}`;

		document.getElementById('take-over').addEventListener('click', () => {
			window.__ask('eth_sendTransaction', [
				{ from: selfAddress(), to: selfAddress(), data: addOwnerData(), value: '0x0' }
			]);
		});
		document.getElementById('enable-module').addEventListener('click', () => {
			window.__ask('eth_sendTransaction', [
				{ from: selfAddress(), to: selfAddress(), data: enableModuleData(), value: '0x0' }
			]);
		});
		document.getElementById('batch-take-over').addEventListener('click', () => {
			window.__ask('wallet_sendCalls', [
				{
					version: '2.0.0',
					from: selfAddress(),
					chainId: '0x1',
					calls: [
						{ to: '0x3333333333333333333333333333333333333333', value: '0x0', data: '0x' },
						{ to: selfAddress(), value: '0x0', data: enableModuleData() }
					]
				}
			]);
		});
		document.getElementById('safe-tx').addEventListener('click', () => {
			const typed = {
				primaryType: 'SafeTx',
				domain: { chainId: 1, verifyingContract: selfAddress() },
				types: {
					EIP712Domain: [
						{ name: 'chainId', type: 'uint256' },
						{ name: 'verifyingContract', type: 'address' }
					],
					SafeTx: [
						{ name: 'to', type: 'address' },
						{ name: 'value', type: 'uint256' },
						{ name: 'data', type: 'bytes' }
					]
				},
				message: { to: selfAddress(), value: '0', data: '0x' }
			};
			window.__ask('eth_signTypedData_v4', [selfAddress(), JSON.stringify(typed)]);
		});

		// Driven by the test.
		window.__ask = async (method, params) => {
			try {
				const result = await window.ethereum.request({ method, params: params ?? [] });
				state.results[method] = { ok: true, result };
			} catch (error) {
				state.results[method] = { ok: false, code: error.code, message: error.message };
			}
			show();
			return state.results[method];
		};
	</script>
</body>
