<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="0 0 68 68">
  <!--
    Vela Wallet application icon - THE canonical mark for every platform.
    iOS, Android, Windows, macOS and Linux icons are all rendered from this
    file by scripts/gen-app-icons.sh and
    app-desktop/vela-wallet/scripts/generate-desktop-icons.sh.

    Geometry and colours are verbatim from the design source,
    docs/design/onboarding/Vela App Screen Icon _ Universal - iPhone.svg. Only the
    Penpot export scaffolding was removed: wrapper groups, generated ids, a
    display:none backing rect, and CSS `style="fill: ..."` declarations that
    ImageMagick's SVG renderer ignores (it would draw the whole icon black).

    KEEP <svg> ON THE SECOND LINE. gdk-pixbuf identifies SVG by sniffing the
    first few hundred bytes; a comment above the tag pushes it out of that
    window and the file stops being recognised as an image at all.
  -->
  <rect x="1" y="1" width="66" height="66" rx="18" ry="18" fill="#f46d50"/>
  <path d="M33,12C25,21,20,32,17,42L33,42L33,12Z" fill="#fff3ec"/>
  <path d="M36,19C45,25,50,34,52,42L36,42L36,19Z" fill="#ffc6b0"/>
  <path d="M13,46L55,46C52,52,47,55,40,55L28,55C21,55,16,52,13,46Z" fill="#5a4037"/>
</svg>
