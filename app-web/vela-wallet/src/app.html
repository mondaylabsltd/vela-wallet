<!doctype html>

<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="color-scheme" content="dark light" />
		<!--
			The wallet's mark, from docs/design/icon/app-icon.svg (the canonical source
			every platform's icon is rendered from). The PNGs are for the tab strip
			of browsers that will not rasterise an SVG favicon; the SVG is for the
			rest, at any size.
		-->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<script>
			/*
			 * Spec 028: the chosen palette, applied BEFORE first paint — the same
			 * argument the block below makes for the launch animation. A theme
			 * applied in `onMount` means the page paints in the OS palette and then
			 * flips to the chosen one, which on a wallet reads as a glitch rather
			 * than a setting. `vela.theme` is written by
			 * `services/preferences.svelte.ts` and read by `isDarkTheme()` off this
			 * same attribute; `system` writes nothing, so the OS keeps deciding.
			 */
			try {
				var theme = localStorage.getItem('vela.theme');
				if (theme === 'dark' || theme === 'light') {
					document.documentElement.dataset.theme = theme;
				}
			} catch (e) {
				/* Blocked storage: the OS palette, which is the default anyway. */
			}

			/*
			 * The chosen text size, for the same reason: applied in `onMount` it
			 * would paint at the standard size and then jump. `vela.textScale` holds
			 * a level NAME (Expo's record), and the table is `TEXT_SCALE_LEVELS` in
			 * `services/preferences.svelte.ts` — duplicated here because nothing can
			 * be imported yet; `preferences-store.test.ts` asserts the two agree.
			 * `standard` writes nothing: `--text-scale` falls back to 1.
			 */
			try {
				var scales = { compact: 0.82, small: 0.91, comfortable: 1.1, large: 1.22, xlarge: 1.35 };
				var level = localStorage.getItem('vela.textScale');
				if (level !== null && scales[level] !== undefined) {
					document.documentElement.style.setProperty('--text-scale', String(scales[level]));
				}
			} catch (e) {
				/* Blocked storage: the standard size. */
			}

			/*
			 * set-12: the language the person PINNED in Settings, before first
			 * paint. Spec 006 keeps cookies out of the wallet, so `/` negotiates
			 * Accept-Language alone and cannot see the pin (`localStorage`); this
			 * page can. When the pin names another shipped locale, this page is
			 * replaced by that locale's — one hop, hidden meanwhile so the wrong
			 * language never shows. `auto`, nothing, or the same locale: stay.
			 * Pages of the extension (not http) have their own doorways.
			 *
			 * `pinnedLocaleTarget` in `$lib/i18n/locales.ts`, duplicated because
			 * nothing can be imported yet; `locales.test.ts` runs this block
			 * against it. PREF key 'vela.language'.
			 */
			/* set-12:begin */
			try {
				if (location.protocol === 'https:' || location.protocol === 'http:') {
					var shipped = [
						'en',
						'zh',
						'zh-TW',
						'zh-HK',
						'ja',
						'ko',
						'vi',
						'id',
						'tr',
						'es-MX',
						'pt-BR',
						'fr',
						'de',
						'ru',
						'it'
					];
					var canonical = function (tag) {
						for (var i = 0; i < shipped.length; i++) {
							if (shipped[i].toLowerCase() === String(tag).toLowerCase()) return shipped[i];
						}
						return null;
					};
					var pin = localStorage.getItem('vela.language');
					var wanted = pin && pin !== 'auto' ? canonical(pin) : null;
					var segments = location.pathname.split('/');
					var here = canonical(segments[1] || '');
					if (wanted && here && wanted !== here) {
						segments[1] = wanted;
						document.documentElement.style.visibility = 'hidden';
						location.replace(segments.join('/') + location.search + location.hash);
					}
				}
			} catch (e) {
				/* Blocked storage: the page `/` chose, as before there was a pin. */
			}
			/* set-12:end */

			/*
			 * Round 5: the connect page opened from an approve-later link (its
			 * transaction in the fragment, `ms=`, and no invite) is reading that
			 * transaction from its first frame — said so before any module runs,
			 * never "Connecting to Vela…" for a page that is not waiting on Vela.
			 * The fragment never reaches the prerendered page; this reads it.
			 * `connect-boot.test.ts` runs this block.
			 */
			/* connect-boot:begin */
			try {
				var fragment = location.hash || '';
				if (
					/\/connect\/?$/.test(location.pathname) &&
					/(^#|&)ms=/.test(fragment) &&
					!/(^#|&)wss?(%3A|:)/i.test(fragment)
				) {
					document.documentElement.dataset.connectTx = '1';
				}
			} catch (e) {
				/* No fragment to read: the page says what it waits for once it runs. */
			}
			/* connect-boot:end */

			/*
			 * Spec 012: decide BEFORE first paint whether the launch animation plays,
			 * and if so hide the page in the same frame the document appears.
			 *
			 * This must be an inline, render-blocking script. Deciding in `onMount`
			 * means the prerendered page paints first and is only then covered, so the
			 * user sees Welcome → animation → Welcome. The founder asked for the order
			 * to be right; this is the only place it can be guaranteed.
			 *
			 * The replay rule is the core's (`vela_core::launch::launch_animation_due`,
			 * every shell asks it). It cannot be called here: this runs before any
			 * module loads, and the Welcome page never loads the core. So this is a
			 * copy, and `$lib/launch/constants.test.ts` runs it against the core's own
			 * vectors (`rust/crates/vela-core/tests/vectors/launch-animation.json`): a
			 * divergence would hide the page for an animation the component then
			 * declines to play, i.e. a blank screen.
			 *
			 * VELA_LAUNCH_REPLAY_AFTER_MS = 604800000  (7 days)
			 */
			// The connect page (an outside owner's wallet, `/<locale>/connect`) is a
			// utility page for someone who may never have used Vela: no splash.
			/* launch-gate:begin */
			var quiet =
				location.search.indexOf('skipLaunch') !== -1 || /\/connect\/?$/.test(location.pathname);
			try {
				var due = true;
				var raw = localStorage.getItem('vela.launch.played');
				if (raw !== null) {
					var last = Number(raw);
					due = !isFinite(last) || Date.now() - last >= 604800000;
				}
				if (due && !quiet) {
					document.documentElement.dataset.launch = 'playing';
				}
			} catch (e) {
				/* Blocked storage: play it. A decoration must never be the reason a
				   wallet page fails. */
				if (!quiet) {
					document.documentElement.dataset.launch = 'playing';
				}
			}
			/* launch-gate:end */

			/*
			 * Spec 038: decide BEFORE first paint whether the first-run intro is up,
			 * for the same reason as the launch block above — decided in `onMount`
			 * the prerendered landing page paints first and is then replaced, so a
			 * first run saw Welcome → intro on every load (spec 038 finding 2).
			 * `app.css` hides `[data-intro-page]` (the Welcome main) under this
			 * attribute; the page removes it once the intro has mounted or the gate
			 * has said no, so it never outlives the decision.
			 *
			 * The rule is duplicated from `$lib/intro/gate.ts` — it cannot be
			 * imported here. `gate.test.ts` reads this file and asserts the storage
			 * key and both query params agree with the module's constants.
			 *
			 *   STORAGE_KEY = 'vela.intro.seen'   FORCE_PARAM = 'intro'   SKIP_PARAM = 'skipIntro'
			 */
			try {
				var introParams = new URLSearchParams(location.search);
				var introDue = introParams.has('intro')
					? true
					: introParams.has('skipIntro')
						? false
						: localStorage.getItem('vela.intro.seen') === null;
				/*
				 * ob-6: a signed-in person on Welcome is on their way to the wallet
				 * (`welcomeBelongsInWallet` in the same module) — hide the landing
				 * page rather than flash it. ACCOUNTS_KEY = 'vela.accounts',
				 * STAY_PARAM = 'stay'.
				 */
				var accounts = localStorage.getItem('vela.accounts');
				var signedIn =
					!introParams.has('stay') && !introParams.has('intro') && !!accounts && accounts !== '[]';
				if (introDue || signedIn) {
					document.documentElement.dataset.intro = 'pending';
				}
			} catch (e) {
				/* Blocked storage: the module shows it too, so hide Welcome. */
				if (location.search.indexOf('skipIntro') === -1) {
					document.documentElement.dataset.intro = 'pending';
				}
			}
		</script>
		%sveltekit.head%
		<!-- The core's wasm on the pages that boot it (`$lib/core/preload.ts`). -->
		%vela.corePreload%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
