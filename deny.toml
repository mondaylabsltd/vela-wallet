[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git source must name a commit. A branch, or nothing, means "whatever
# upstream says at the next `cargo update`"; a tag can be moved.
required-git-spec = "rev"
allow-git = [
  # gpui (Zed's UI framework) and its sibling crates: not on crates.io at a
  # usable version. Pinned to one commit in app-desktop/vela-wallet/Cargo.toml
  # and vendor/gpui_macos/Cargo.toml; moving it is a reviewed upstream diff.
  "https://github.com/zed-industries/zed",
  # Zed's forks that gpui itself pins by rev (font loading, Linux XIM input).
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/xim-rs",
  # The Lottie player for the launch animation: crates.io has only a 2024
  # alpha (app-desktop Cargo.toml, spec 012 research D2). Pinned to the
  # commit of tag v0.1.58.
  "https://github.com/LottieFiles/dotlottie-rs",
]
