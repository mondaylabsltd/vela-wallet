[advisories]
# RustSec, fetched fresh on every run (no --offline in CI).
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked version is the maintainer saying "do not use this"; for a wallet
# that is a failure, not a warning.
yanked = "deny"
# Unmaintained and unsound fail for direct AND transitive crates: the
# audience reads the whole graph, so this file has to account for all of it.
unmaintained = "all"
unsound = "all"
# One config serves two graphs, so each run sees the other graph's ignores
# as unused. Warn (do not fail): an ignore that NEITHER run uses is stale and
# must be deleted.
unused-ignored-advisory = "warn"
ignore = [
  # ---- Fixed in rust/Cargo.lock in Round 22 (§38) ---------------------------
  # crypto-bigint 0.7.5 -> 0.7.10 (RUSTSEC-2026-0387), ctutils 0.4.2 -> 0.4.8
  # (RUSTSEC-2026-0385), wnaf 0.14.0 -> 0.14.1 (yanked), tokio 1.54.0 -> 1.54.1
  # (RUSTSEC-2026-0384, yanked), ruint 1.19.0 -> 1.20.1 (RUSTSEC-2026-0220):
  # semver-compatible, no new crate, shipped with the rebuilt web wasm. The
  # first two were reachable with secrets on the phones (the CTAP2 PIN/UV ECDH
  # in ctap/ceremony.rs, the caBLE keys and AES-GCM channel).
  #
  # What remains of RUSTSEC-2026-0387 is the DESKTOP's copy:
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (desktop only, via p256 0.13): its only shipped use is updater.rs's ECDSA VERIFY of the release signature — public inputs, no secret to leak (the signing / ECDH uses are #[cfg(test)]). No 0.5.x fix exists. Exit: move the desktop's p256 to 0.14 like the core (rust/ is on the fixed 0.7.10)." },

  # ---- Unmaintained, build-time only (proc macros / codegen) -----------------
  # Code that runs in rustc on this repository's own sources; no runtime or
  # attacker input. Removed when the parent drops them.
  { id = "RUSTSEC-2024-0436", reason = "paste (archived): proc-macro used by alloy-primitives / syn-solidity at compile time only. Exit: alloy moving off it." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.x: proc-macro of crux_macros 0.10 at compile time only. Exit: a crux_core release off it." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (desktop): proc-macro of stacksafe-macro under gpui, compile time only. Exit: the next gpui pin." },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml (archived, rust/ only): askama_derive under uniffi_bindgen, reading this repo's own templates/config at build time. Exit: a uniffi release whose askama uses `toml`." },

  # ---- Unmaintained, runtime, no maintained drop-in today --------------------
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3, a dependency of crux_core 0.19 (both graphs). The bincode team declared 1.3.3 complete when it stopped; no shell hands crux bincode bytes from outside the process. Exit: crux_core dropping it." },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2 (desktop): rustls-native-certs 0.7 under tungstenite 0.24 reads the OS trust store's PEM files (local, OS-owned input). Exit: tungstenite >= 0.26 (rustls-native-certs 0.8, rustls-pki-types' PEM parser) — a manifest bump of the caBLE tunnel crate, in its own PR with the caBLE tests." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz (desktop): text shaping in usvg (resvg `text`, the share card) and gpui; input is system fonts and our own SVG strings. Exit: resvg/usvg moving to its successor." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser (desktop): font parsing for usvg/fontdb and gpui's cosmic-text; input is system fonts. Exit: the same resvg/cosmic-text migration." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant (desktop Linux): D-Bus serialisation under zbus for gpui_linux's accessibility (AT-SPI), portals and notifications; the peer is the user's session bus. Exit: the next gpui pin on a maintained zbus." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names (desktop Linux): same zbus stack as zvariant. Exit: the next gpui pin." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (desktop Linux): proc-macro of the same zbus stack. Exit: the next gpui pin." },

  # ---- Unsound / vulnerable, not reachable (desktop) -------------------------
  { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 IterMut Stacked-Borrows violation, via rqrr 0.9 (QR decode). rqrr calls new/get/put/iter/pop_lru, never iter_mut. Exit: rqrr 0.11 (lru 0.18) — a direct-dependency bump, with the scanner's tests." },
  { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 pop() not panic-safe, via rqrr 0.9: needs a key type whose Drop panics plus catch_unwind; rqrr's keys are u8. Exit: rqrr 0.11 (lru 0.18.2+)." },
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness: in no shipped build. glib comes only through wry -> gtk/webkit2gtk, which needs a Linux target, while vela-wallet depends on wry only off Linux; `cargo tree -i glib --target <t>` is empty for every [graph] target. Listed only because of the edge-union limit noted in [graph]." },
  { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2 (via dotlottie-rs) keeps SUID/SGID on extract(): dotlottie-rs only runs ZipArchive::new over the .lottie bytes compiled into the app and reads entries by name; extract() is only in its build.rs for the emscripten (wasm) target, which is not built. (zip 8.x via calamine was removed by moving calamine to 0.38 / zip 9.) Exit: a dotlottie-rs release on zip >= 9." },
  { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2 extract() symlink escape: as RUSTSEC-2026-0367 — no extract() at runtime, the input is our bundled asset." },
  { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2 extract() permissions through symlinks: as RUSTSEC-2026-0367." },
  { id = "RUSTSEC-2026-0429", reason = "zip 2.4.2 extract() abort on a large symlink entry: as RUSTSEC-2026-0367." },
]

