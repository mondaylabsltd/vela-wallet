[licenses]
# The repository is MIT (LICENSE). Everything in `allow` is permissive and
# compatible with distributing MIT-licensed binaries, app stores included.
# dev-dependencies are not checked (in no artifact); build-dependencies ARE
# (they run in the build and can emit code into it).
include-build = true
confidence-threshold = 0.9
# One config serves two graphs; a licence or exception one graph does not
# use is not a finding.
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # rustix, linux-raw-sys, wasi, target-lexicon: Apache plus a linking exception
  "BSD-2-Clause",                   # arrayref, rav1e, av1-grain, v_frame
  "BSD-3-Clause",                   # curve25519/ed25519/x25519-dalek, subtle, tiny-skia, bindgen, exr, encoding_rs (with MIT/Apache)
  "ISC",                            # ring (with Apache-2.0), rustls-webpki, untrusted, libloading, minreq
  "Unicode-3.0",                    # ICU4X (idna), unicode-ident
  "Zlib",                           # foldhash, slotmap, nanorand, zlib-rs
  "CC0-1.0",                        # tiny-keccak, hexf-parse (naga); public-domain dedication
]
exceptions = [
  # Permissive, but used by exactly one crate each: scoped so a new crate
  # under them is a review, not a silent pass.
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },  # Mozilla's CA list as data
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },        # bzip2's BSD-style licence

  # --- MPL-2.0: weak, FILE-level copyleft ------------------------------------
  # Compatible with an MIT program: the obligation is that the MPL-covered
  # files stay available in source form with their notices, which they are
  # (unmodified, on crates.io). Patching one of these crates' files would
  # oblige publishing those files. Listed by name so a new MPL crate is a
  # decision.
  { crate = "uniffi", allow = ["MPL-2.0"] },                  # phones: the bindings runtime, linked
  { crate = "uniffi_core", allow = ["MPL-2.0"] },
  { crate = "uniffi_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_meta", allow = ["MPL-2.0"] },
  { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },          # build-time generator
  { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
  { crate = "uniffi_udl", allow = ["MPL-2.0"] },
  { crate = "cbindgen", allow = ["MPL-2.0"] },                # build-time only (gpui_macos, dotlottie-rs)
  { crate = "cssparser", allow = ["MPL-2.0"] },               # desktop mac/windows: wry -> dom_query
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "dwrote", allow = ["MPL-2.0"] },                  # desktop Windows: DirectWrite via zed's font-kit
  { crate = "option-ext", allow = ["MPL-2.0"] },              # dirs -> dirs-sys

  # --- GPL-3.0-or-later: STRONG copyleft — a flagged, OPEN licence risk ------
  # zlog, ztracing and ztracing_macro are Zed crates gpui depends on
  # (gpui -> sum_tree -> ztracing -> zlog), declared GPL-3.0-or-later at the
  # pinned rev c97b7c0e. zlog and ztracing are LINKED into the desktop
  # binary. GPLv3 code in it does not fit shipping the app under MIT alone,
  # nor the Mac App Store's terms. Zed, the copyright holder, relicensed all
  # three to Apache-2.0 in zed-industries/zed#63573 (commit ac5af8b9,
  # 2026-09-01: "these crates have to be non-copyleft for GPUI to ship as a
  # permissively licensed project"); ztracing_macro's source is byte-identical
  # between our pin and that commit, zlog and ztracing differ in one file
  # each. This exception keeps the gate green ONLY because the fix is known:
  # EXIT = move the gpui pin to a commit at or after ac5af8b9 (refreshing
  # app-desktop/vendor/gpui_macos with it), then delete these three lines.
  # Until then no desktop release ships without the owner accepting this.
  # Version-pinned so any other copy of them fails.
  { crate = "zlog@0.1.0", allow = ["GPL-3.0-or-later"] },
  { crate = "ztracing@0.1.0", allow = ["GPL-3.0-or-later"] },
  { crate = "ztracing_macro@0.1.0", allow = ["GPL-3.0-or-later"] },
]

# Our own crates carry no `license` field; the repository's LICENSE (MIT)
# covers them. Clarified against that file's hash, so a change to LICENSE
# makes these stop applying (and the check fail) until reviewed. The cleaner
# fix — `license = "MIT"` and `publish = false` in each manifest — is a
# sweep of every manifest we own (vela-core's and vela-core-wasm's are in the
# committed wasm's fingerprint, every rust/crates one in the iOS core stamp),
# left to R23 so this round's wasm rebuild carries only the advisory bumps.
[[licenses.clarify]]
crate = "vela-core"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-core-wasm"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-core-uniffi"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-dev-fixtures-uniffi"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-uniffi-bindgen"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-agent"
expression = "MIT"
license-files = [{ path = "../../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-wallet"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0x2188f0ce }]
[[licenses.clarify]]
crate = "vela-passkey-win"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0x2188f0ce }]

[licenses.private]
ignore = false

# ---------------------------------------------------------------------------
[bans]
# Duplicates WARN, not deny: gpui alone brings two generations of objc2,
# windows-sys and the RustCrypto traits, and the core deliberately sits on
# the newer RustCrypto generation (rust/Cargo.toml says why). Denying would
# force skip-lists that hide the information instead of acting on it. Read
# the warnings when a bump lands; collapse what a bump makes collapsible.
multiple-versions = "warn"
highlight = "simplest-path"
# Wildcards WARN for now. cargo-deny counts every path/git dependency of a
# crate that is not `publish = false` as a wildcard, and our crates carry no
# `publish` field; adding it to vela-core-wasm changes the committed wasm's
# fingerprint and the iOS core stamp. A real `*` cannot reach us
# transitively (crates.io refuses wildcard requirements), so the only source
# is a manifest in this repository.
# EXIT (R23): add `publish = false` + `license = "MIT"` to every manifest
# we own, rebuild the wasm in the same PR, then set `wildcards = "deny"` and
# drop the clarify entries above.
wildcards = "warn"
allow-wildcard-paths = true
deny = [
  # TLS in everything we ship is rustls (the core's tungstenite/clientmcp,
  # the desktop's ureq and tungstenite). OpenSSL / native-tls may exist only
  # where it is today: the downloader in dotlottie-rs's build script
  # (minreq), a build-dependency that never links into the app.
  { crate = "native-tls", wrappers = ["minreq"], reason = "TLS is rustls everywhere we ship; native-tls only under dotlottie-rs's build-time minreq" },
  { crate = "openssl", wrappers = ["native-tls"], reason = "only behind the build-time native-tls above" },
  { crate = "openssl-sys", wrappers = ["native-tls", "openssl"], reason = "only behind the build-time native-tls above" },
]

