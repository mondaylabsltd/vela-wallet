# cargo-deny policy for every Rust graph this repository ships (Round 22,
# supply chain). ONE file for both lockfiles:
#
#   rust/Cargo.lock                    the core: web wasm, Android .so, iOS
#                                      xcframework (vela-core, -wasm, -uniffi,
#                                      vela-agent, vendored peerconnect and
#                                      clientmcp-client)
#   app-desktop/vela-wallet/Cargo.lock the desktop app (gpui from git, the core
#                                      by path, vendor/gpui_macos patched in,
#                                      vela-passkey-win by path)
#
#   cargo deny --manifest-path rust/Cargo.toml                    --config deny.toml check
#   cargo deny --manifest-path app-desktop/vela-wallet/Cargo.toml --config deny.toml check
#
# Default features, not --all-features: every shipped artifact is built with
# the features its build script names, and `--all-features` would fold in
# test-only seams (`dev-fixtures`, `update-test`, `bindings`) that a release
# never carries. The extra crates those features pull are dev tooling of ours
# (ts-rs, the fixture keyset) — when a feature like that gains a third-party
# dependency, run the same command once with `--all-features` and read it.
#
# Every `ignore`/exception below says WHY it is safe today and WHAT removes it.
# An entry is a debt with an exit, not a silencer: "upstream has no fix" is
# only acceptable together with "the code path is not reachable" or "the input
# is ours".

[graph]
# What ships, and nothing else: a dependency that exists only for, say,
# Redox or wasm32-wasi is not in any artifact and would be noise here. Keep
# this in step with the build scripts (rust/scripts/build-*.sh,
# app-android/.../build.gradle.kts abiFilters, the desktop packaging
# workflows). The iOS simulator is CI-only but has the same graph as iOS.
#
# KNOWN LIMIT: cargo-deny keeps an edge when its `cfg` matches ANY target in
# this list, judged edge by edge — so `vela-wallet -> wry` (not Linux) and
# `wry -> gtk` (Linux only) are both kept and gtk appears although no build
# contains it. `cargo tree -i <crate> --target <triple>` is the per-target
# truth; the glib entry below was checked that way.
targets = [
  "wasm32-unknown-unknown",     # web wallet + extension (vela-core-wasm)
  "aarch64-apple-darwin",       # desktop macOS
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",   # desktop Linux (x64 + arm64 packages)
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",     # desktop Windows (x64 + arm64 packages)
  "aarch64-pc-windows-msvc",
  "aarch64-linux-android",      # Android ABIs (build-android.sh: arm64-v8a,
  "armv7-linux-androideabi",    #   armeabi-v7a, x86_64)
  "x86_64-linux-android",
  "aarch64-apple-ios",          # iOS device
  "aarch64-apple-ios-sim",      # iOS simulator (CI tests)
]

[output]
feature-depth = 1

