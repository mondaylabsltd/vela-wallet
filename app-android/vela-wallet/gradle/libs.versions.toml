[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
kotlin = "2.2.10"
# The newest BOM whose libraries compile against API 36: 2026.08.00+ brings
# Compose 1.12 (ui-android's AAR metadata: minCompileSdk=37), and this app
# stays on compileSdk 36 (see app/build.gradle.kts). 2026.06.01 = Compose 1.11.4.
composeBom = "2026.06.01"
navigationCompose = "2.9.5"
datastore = "1.1.7"
work = "2.10.5"
webkit = "1.14.0"
splashscreen = "1.0.1"
# Spec 088 FR-002: 5.17.0 is the first JNA whose libjnidispatch runs on 16 KB-page devices
# (jna#1618 in 5.16.0, jna#1647 in 5.17.0) and ships 16 KB-aligned 64-bit libraries.
jna = "5.17.0"
kotlinxCoroutines = "1.10.2"
orgJson = "20260814"
credentials = "1.5.0"
playServicesFido = "21.1.0"
# The newest OkHttp that compiles against API 36: okhttp-android 5.4.0 asks
# for minCompileSdk=36, 5.5.x for 37.
okhttp = "5.4.0"
kotlinxSerialization = "1.9.0"
# Spec 046: the scanner — CameraX for the frames. The decode is vela-qr (rust/vela-qr/ffi,
# libvela_qr.so over JNA, built by rust/scripts/build-android.sh): no library here, no Google services.
camerax = "1.4.1"
# Native parity Phase 3: the home-screen balance widget.
glance = "1.1.1"
# Native parity Phase 4 (perf): Macrobenchmark + the Baseline Profile Gradle plugin.
# The test-side androidx.test versions are the ones benchmark 1.5 is built against;
# they live under their own names so the app's own androidTest set is untouched.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
benchmarkTestExtJunit = "1.2.1"
benchmarkTestRunner = "1.6.2"

[libraries]
# The caBLE WebSocket tunnel (CTAP 2.2 channel of the hybrid transport).
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# Spec 043: the background receipt poll (research D5) — the core owns the cadence, the worker supplies the clock.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
# Spec 044: document-start scripts for the in-app browser's provider (research D2).
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# Credential Manager: the only route to WebAuthn on modern Android. The
# play-services-auth companion is what serves Google Password Manager as a
# provider on devices that have it; without it the request reaches only
# providers that register through Credential Manager directly.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
# The FIDO2 API, for the ceremony Credential Manager will not offer: an OEM
# selector that lists only password managers has no way to reach a USB security
# key (Galaxy S22: "CreateOptions size=2"), and this is the API behind the
# system's own "insert or tap your security key" screen.
play-services-fido = { group = "com.google.android.gms", name = "play-services-fido", version.ref = "playServicesFido" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# `Task.await()`, so the FIDO2 pending intent is fetched without a callback.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# The wire types of twenty-four Crux machines, decoded by declaration rather
# than by hand (spec 040 research D2). serde's `tag = "type"` + snake_case is
# exactly this library's default discriminator, so a Kotlin wire class is a
# transcription of the Rust enum instead of a parser. `org.json` stays for
# AccountStore, which deliberately does NOT want typed records.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Phase 4: installs the shipped baseline profile on sideloaded and benchmark
# installs (Play applies it from the bundle's dex metadata by itself).
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "benchmarkTestExtJunit" }
androidx-benchmark-test-runner = { group = "androidx.test", name = "runner", version.ref = "benchmarkTestRunner" }

[plugins]
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
