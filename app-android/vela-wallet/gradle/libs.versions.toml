[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
kotlin = "2.2.10"
composeBom = "2025.12.00"
navigationCompose = "2.9.5"
datastore = "1.1.7"
splashscreen = "1.0.1"
jna = "5.14.0"
kotlinxCoroutines = "1.10.2"
orgJson = "20240303"
lottie = "6.7.1"
credentials = "1.5.0"
playServicesFido = "21.1.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"

[libraries]
# The caBLE WebSocket tunnel (CTAP 2.2 channel of the hybrid transport).
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# Credential Manager: the only route to WebAuthn on modern Android. The
# play-services-auth companion is what serves Google Password Manager as a
# provider on devices that have it; without it the request reaches only
# providers that register through Credential Manager directly.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
# The FIDO2 API, for the ceremony Credential Manager will not offer: an OEM
# selector that lists only password managers has no way to reach a USB security
# key (Galaxy S22: "CreateOptions size=2"), and this is the API behind the
# system's own "insert or tap your security key" screen.
play-services-fido = { group = "com.google.android.gms", name = "play-services-fido", version.ref = "playServicesFido" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# `Task.await()`, so the FIDO2 pending intent is fetched without a callback.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# The wire types of twenty-four Crux machines, decoded by declaration rather
# than by hand (spec 040 research D2). serde's `tag = "type"` + snake_case is
# exactly this library's default discriminator, so a Kotlin wire class is a
# transcription of the Rust enum instead of a parser. `org.json` stays for
# AccountStore, which deliberately does NOT want typed records.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Airbnb's Lottie for Compose (spec 012). Maven Central, pure Kotlin/Java, no
# native library — so it adds nothing to the ABI payload the uniffi .so already
# constrains. dotLottie was measured and rejected: not on Maven Central at all
# (its README's coordinate 404s), JitPack only. See research D2.
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
