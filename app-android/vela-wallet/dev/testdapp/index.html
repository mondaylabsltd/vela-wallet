<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vela test dApp (Android)</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; }
  button { font-size: 18px; padding: 12px 16px; margin: 6px 6px 6px 0; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 12px; }
</style>
<body>
  <h1>Vela test dApp</h1>
  <p>Spec 044's device harness: the web's <code>e2e/testdapp/index.html</code> plus the two buttons that move money.</p>
  <button id="connect" type="button">Connect</button>
  <button id="chain" type="button">Chain</button>
  <button id="block" type="button">Block number</button>
  <button id="switch" type="button">Switch to Gnosis</button>
  <button id="sign" type="button">Sign</button>
  <button id="takeover" type="button">Add owner (blocked)</button>
  <button id="enablemodule" type="button">Enable module (blocked)</button>
  <button id="safetx" type="button">SafeTx typed data (blocked)</button>
  <button id="send" type="button">Send dust</button>
  <button id="approve" type="button">Approve unlimited</button>
  <button id="bundle" type="button">Bundle: approve unlimited + reset</button>
  <button id="verify" type="button">Verify sign</button>
  <button id="siwe" type="button">SIWE</button>
  <button id="siwe-bad" type="button">SIWE (other domain)</button>
  <button id="ethsign" type="button">eth_sign</button>
  <!-- Spec 070: the answers the core now decides the same way everywhere. -->
  <button id="add" type="button">Add Base</button>
  <button id="add-unknown" type="button">Add chain 1337</button>
  <button id="coinbase" type="button">Coinbase</button>
  <button id="watch" type="button">Watch asset</button>
  <button id="revoke" type="button">Revoke</button>
  <button id="unknown" type="button">Unknown method</button>
  <button id="alert" type="button">alert()</button>
  <a href="mailto:test@example.com">mailto link</a>
  <a href="https://example.com/" target="_blank">target=_blank</a>
  <!-- A second origin, framed: it calls the host bridge directly, the way an ad
       iframe would. The wallet must never hear it (spec 070 FR-012). -->
  <iframe id="attacker" title="attacker" style="width:100%;height:40px;border:1px dashed #999"></iframe>
  <pre id="out">waiting…</pre>
  <!-- Vendored (spec 070): a CDN the phone cannot reach made Verify a dead button. -->
  <script src="keccak.js"></script>
  <script>
    const out = document.getElementById('out');
    const state = { announced: [], legacy: null, results: {}, events: [] };
    const show = () => (out.textContent = JSON.stringify(state, null, 2));
    window.addEventListener('eip6963:announceProvider', (ev) => {
      const { info, provider } = ev.detail;
      state.announced.push({ name: info.name, rdns: info.rdns, sameAsWindowEthereum: provider === window.ethereum, frozenInfo: Object.isFrozen(info) });
      window.__velaProvider = provider;
      for (const event of ['accountsChanged', 'chainChanged', 'connect', 'disconnect']) {
        provider.on(event, (data) => { state.events.push({ event, data }); show(); });
      }
      show();
    });
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    state.legacy = window.ethereum ? { present: true, isMetaMask: window.ethereum.isMetaMask === true, isVela: window.ethereum.isVela === true } : { present: false };
    show();
    const FOUNDER = '0x76875e38fc6Bc2dEDCaed807cE00782DB5C0D141';
    const GNOSIS_USDC = '0xDDAfbb505ad214D7b80b1f830fcCc89B60fb7A83';
    const SPENDER = '0x1111111111111111111111111111111111111111';
    const MAX = 'f'.repeat(64);
    const me = () => (state.results.eth_requestAccounts && state.results.eth_requestAccounts.result || [])[0] || window.ethereum.selectedAddress;
    window.__ask = async (method, params) => {
      try {
        const result = await window.ethereum.request({ method, params: params ?? [] });
        state.results[method] = { ok: true, result };
      } catch (error) {
        state.results[method] = { ok: false, code: error.code, message: error.message };
      }
      show();
      return state.results[method];
    };
    document.getElementById('connect').onclick = () => window.__ask('eth_requestAccounts');
    document.getElementById('chain').onclick = () => window.__ask('eth_chainId');
    document.getElementById('block').onclick = () => window.__ask('eth_blockNumber');
    document.getElementById('switch').onclick = () => window.__ask('wallet_switchEthereumChain', [{ chainId: '0x64' }]);
    document.getElementById('sign').onclick = () => window.__ask('personal_sign', ['0x48656c6c6f2c2056656c61', me()]);
    document.getElementById('send').onclick = () => window.__ask('eth_sendTransaction', [{ from: me(), to: FOUNDER, value: '0x38d7ea4c68000' }]);
    // Spec 046 US2: a SIWE message for this page's origin, and one that names another domain.
    const hex = (text) => '0x' + Array.from(new TextEncoder().encode(text)).map((b) => b.toString(16).padStart(2, '0')).join('');
    const siwe = (domain, uri) => `${domain} wants you to sign in with your Ethereum account:\n${me()}\n\nSign in to the test dApp.\n\nURI: ${uri}\nVersion: 1\nChain ID: 100\nNonce: 8fj2kd93lq\nIssued At: 2026-09-12T00:00:00.000Z`;
    document.getElementById('siwe').onclick = () => window.__ask('personal_sign', [hex(siwe(location.host, location.origin)), me()]);
    document.getElementById('siwe-bad').onclick = () => window.__ask('personal_sign', [hex(siwe('evil.example', 'https://evil.example')), me()]);
    document.getElementById('ethsign').onclick = () => window.__ask('eth_sign', [me(), '0x48656c6c6f2c2056656c61']);
    // EIP-1271 through the wallet's own read proxy: isValidSignature(bytes32,bytes) must answer its selector.
    document.getElementById('verify').onclick = async () => {
      const sig = state.results.personal_sign && state.results.personal_sign.result;
      if (!sig) { state.results.verify = { ok: false, message: 'sign first' }; show(); return; }
      const msg = new TextEncoder().encode('Hello, Vela');
      const prefix = new TextEncoder().encode('\x19Ethereum Signed Message:\n' + msg.length);
      const bytes = new Uint8Array(prefix.length + msg.length); bytes.set(prefix); bytes.set(msg, prefix.length);
      const hash = Array.from(window.VelaCS.keccak.hash(bytes)).map((b) => b.toString(16).padStart(2, '0')).join('');
      const sigHex = sig.slice(2);
      const data = '0x1626ba7e' + hash + (64).toString(16).padStart(64, '0') + (sigHex.length / 2).toString(16).padStart(64, '0') + sigHex + '0'.repeat((64 - (sigHex.length % 64)) % 64);
      const r = await window.__ask('eth_call', [{ to: me(), data }, 'latest']);
      state.results.verify = { ok: r.ok, magic: r.ok ? String(r.result).slice(0, 10) : null, valid: r.ok && String(r.result).slice(0, 10) === '0x1626ba7e', error: r.ok ? null : r.message };
      show();
    };
    document.getElementById('add').onclick = () => window.__ask('wallet_addEthereumChain', [{ chainId: '0x2105', chainName: 'Base', rpcUrls: ['https://mainnet.base.org'], nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 } }]);
    document.getElementById('add-unknown').onclick = () => window.__ask('wallet_addEthereumChain', [{ chainId: '0x539', chainName: 'Local 1337' }]);
    document.getElementById('coinbase').onclick = () => window.__ask('eth_coinbase');
    document.getElementById('watch').onclick = () => window.__ask('wallet_watchAsset', { type: 'ERC20', options: { address: GNOSIS_USDC, symbol: 'USDC', decimals: 6 } });
    document.getElementById('revoke').onclick = () => window.__ask('wallet_revokePermissions', [{ eth_accounts: {} }]);
    document.getElementById('unknown').onclick = () => window.__ask('eth_signTransaction', [{}]);
    document.getElementById('alert').onclick = () => { window.alert('hello from the page'); state.results.alert = { ok: true }; show(); };
    // The framed page: the other port of this server, so a different origin.
    const frameOrigin = location.protocol + '//' + location.hostname + ':' + (Number(location.port || 80) + 1);
    document.getElementById('attacker').src = frameOrigin + '/attacker.html';
    document.getElementById('approve').onclick = () => window.__ask('eth_sendTransaction', [{ from: me(), to: GNOSIS_USDC, data: '0x095ea7b3' + SPENDER.slice(2).padStart(64, '0') + MAX, value: '0x0' }]);
    // The Permit2 shape (2026-09-26): an EIP-5792 bundle whose first leg is an
    // unlimited approve. Kept as asked it goes out byte-identical; the second leg
    // resets the allowance, so sliding it for real leaves nothing behind.
    document.getElementById('bundle').onclick = () => window.__ask('wallet_sendCalls', [{
      version: '2.0.0', from: me(), chainId: '0x64', atomicRequired: true,
      calls: [
        { to: GNOSIS_USDC, data: '0x095ea7b3' + SPENDER.slice(2).padStart(64, '0') + MAX, value: '0x0' },
        { to: GNOSIS_USDC, data: '0x095ea7b3' + SPENDER.slice(2).padStart(64, '0') + '0'.repeat(64), value: '0x0' },
      ],
    }]);
  
    // Spec 081: the shapes the self-call guard must refuse.
    const selfAddr = () => me ? me() : window.ethereum.selectedAddress;
    const wordAddr = (a) => a.replace(/^0x/, '').padStart(64, '0');
    document.getElementById('takeover').onclick = () => window.__ask('eth_sendTransaction', [
      { from: selfAddr(), to: selfAddr(), data: '0x0d582f13' + wordAddr(selfAddr()) + '1'.padStart(64, '0'), value: '0x0' }
    ]);
    document.getElementById('enablemodule').onclick = () => window.__ask('eth_sendTransaction', [
      { from: selfAddr(), to: selfAddr(), data: '0x610b5925' + wordAddr(selfAddr()), value: '0x0' }
    ]);
    document.getElementById('safetx').onclick = () => window.__ask('eth_signTypedData_v4', [
      selfAddr(),
      JSON.stringify({
        primaryType: 'SafeTx',
        domain: { chainId: 100, verifyingContract: selfAddr() },
        types: { EIP712Domain: [{ name: 'chainId', type: 'uint256' }, { name: 'verifyingContract', type: 'address' }], SafeTx: [{ name: 'to', type: 'address' }, { name: 'value', type: 'uint256' }, { name: 'data', type: 'bytes' }] },
        message: { to: selfAddr(), value: '0', data: '0x' }
      })
    ]);
  </script>
</body>
