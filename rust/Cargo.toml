[workspace]
resolver = "2"
members = [
  "crates/vela-core",
  "crates/vela-core-uniffi",
  "crates/vela-core-wasm",
  # Debug Android only: the parallel space's fixed keyset (spec 043, D2).
  "crates/vela-dev-fixtures-uniffi",
  # Build-time only: the uniffi generator, so that no SHIPPED crate enables
  # `uniffi/cli` (spec 081 FR-014). Excluded from `default-members` because
  # cargo unifies features across one invocation: a bare `cargo build` here
  # would otherwise fold `cli` — and `uniffi_bindgen` — back into the library
  # that goes to the App Store.
  "crates/vela-uniffi-bindgen",
]
default-members = [
  "crates/vela-core",
  "crates/vela-core-uniffi",
  "crates/vela-core-wasm",
  "crates/vela-dev-fixtures-uniffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Single source of truth for versions — pins per specs/001-rust-core-bindings/research.md.
# NEVER bump uniffi alone: Kotlin/Swift/wasm bindings must regenerate together (checksum coupling).
[workspace.dependencies]
vela-core = { path = "crates/vela-core" }

alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
alloy-dyn-abi = { version = "1.6.1", default-features = false, features = ["std", "eip712"] }
alloy-json-abi = { version = "1.6.1", default-features = false, features = ["std"] }
sha2 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["der", "alloc"] }
# CTAP2's PIN/UV auth protocols (spec 019, research.md D4). Same RustCrypto
# generation as the sha2 the core already uses (0.11 / crypto-common 0.2) —
# mixing generations would pull a second copy of every trait crate.
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
aes = { version = "0.9.1", default-features = false }
# AES-256-GCM for the caBLE v2 / hybrid Noise channel (spec 019 T174,
# `Noise_KNpsk0_P256_AESGCM_SHA256`). Same RustCrypto generation as `aes` 0.9
# (cipher 0.5 / crypto-common 0.2) so no second trait tree is pulled. Only the
# hybrid "sign in with your phone" path needs it; hashing/PIN-UV do not.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
cbc = { version = "0.2.0", default-features = false, features = ["block-padding", "alloc"] }
ciborium = { version = "0.2.2", default-features = false }
ciborium-io = { version = "0.2.2", default-features = false }
coset = { version = "0.4.2", default-features = false }
base64 = "0.22"
# ECMAScript-compliant f64 -> string (Boa's formatter). The identicon hash slices
# the DECIMAL STRING of a chaotic double, so Number::toString semantics — including
# its tie-break rule — are part of the algorithm. std's formatter disagrees with V8
# on ties: specs/003-rust-identicon/research.md D2.
ryu-js = "1.0.3"
# Identicon rasterization for the platforms without an SVG renderer (spec 015,
# research.md D1). Behind vela-core's default-OFF `identicon-raster` feature:
# only the uniffi shell (Android/iOS) and app-desktop enable it — NEVER the wasm
# build (web inlines the SVG string; the 1 MB gate would also reject it).
# default-features = false drops text/font machinery the identicon never uses.
resvg = { version = "0.45", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Portable business state machines (spec 011-crux-onboarding-state). Behind
# vela-core's default-OFF `crux` feature: the uniffi bindings never compile it,
# so the iOS static library and the Android .so are byte-identical without it.
crux_core = "0.19"
# TypeScript mirrors of the Core<->Shell wire types, generated behind the
# `bindings` feature. Never a runtime dependency.
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

uniffi = "0.32.0"
wasm-bindgen = "0.2.126"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6.5"

proptest = "1"
hex-literal = "1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
