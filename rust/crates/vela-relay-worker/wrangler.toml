# The Clear Signer relay (vela-relay/1) on Cloudflare Workers.
# specs/075-clear-signer-channel/contracts/relay.md — see README.md here.
name = "vela-relay"
main = "build/index.js"
# 2026-04-07 or later: web_socket_auto_reply_to_close, so the runtime answers a
# client's close frame on a hibernated socket by itself.
compatibility_date = "2026-04-07"

[build]
command = "worker-build --release"

# One Durable Object per room (idFromName(room id)), holding the room's two
# sockets on the hibernation API. It stores nothing but its alarm.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
