[package]
name = "vela-core-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "wasm-bindgen shell over vela-core for the web shell (app-web/vela-wallet; base64 initSync loading)."

[lib]
crate-type = ["cdylib"]

[dependencies]
# ZERO locale features, deliberately and permanently (spec 004-rust-i18n, D3).
#
# The i18n ENGINE is nearly free here — measured +4,849 wasm bytes. CATALOGS are
# the entire cost, and compiling them in fails the build:
#
#   engine only            535,629
#   engine + en            612,586   (+81,806 for one locale)
#   engine + en,ru         683,660   (+48,566 marginal per locale after the 2nd)
#   engine + all 15      1,315,023   <- 315,023 OVER MAX_WASM_BYTES = 1_000_000
#                                       (rust/scripts/build-web.mjs:42, hard throw)
#
# At 48,566/locale at most 8 fit, leaving less headroom than the engine occupies —
# not a budget. And embedding LOSES over the wire even for a single locale: `en`
# compiled in costs +31,862 brotli'd bytes against 15,353 as plain JSON, because
# base64-wrapping defeats compression on exactly the data type that compresses best.
#
# The web route therefore fetches `assets/i18n/<lng>.json` on demand and hands it to
# `Catalog::from_json`. That is also the only shape that delivers the actual
# requirement: a Japanese reader downloads ja + en, not all fifteen.
# No feature list at all: vela-core's own `default = []` is already zero locales,
# and re-stating `default-features = false` here only earns a cargo warning
# (workspace deps must declare it at the workspace level to be overridable).
#
# `crux` IS enabled here, and only here (spec 011-crux-onboarding-state, D2).
# Web is the one runtime that can execute the onboarding state machines —
# Hermes has no WebAssembly — so `vela-core-uniffi` deliberately does not turn
# it on and the iOS/Android binaries never link the framework:
#   cargo tree -p vela-core-uniffi | grep -c crux   # must stay 0
vela-core = { workspace = true, features = ["crux"] }
wasm-bindgen = { workspace = true }
crux_core = { workspace = true }
tsify = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
# The i18n TOptions DTO uses `#[serde(flatten)]` into a JSON map so a TS caller can
# write the i18next object literal verbatim; unknown keys become interpolation vars.
serde_json = { workspace = true }

# wasm-opt for the shipped module (rust/scripts/build-web.mjs runs
# `wasm-pack build --release`). wasm-pack's default is `-O`, which binaryen
# treats as `-Os`. Measured on this crate with wasm-pack's binaryen 117
# (2026-10-30, 7.70 MB `-Os` build; brotli = q11, 2^24 window, as
# app-web/vela-wallet/scripts/wasm-brotli.mjs ships it):
#
#   -O / -Os     7,700,713 raw   1,811,221 br
#   -Oz          7,429,898 raw   1,815,573 br   (-271 KB raw, +4.4 KB br)
#   -Oz -Os      7,426,095 raw   1,811,668 br   (-275 KB raw, +0.4 KB br)
#
# `-Oz`'s tighter inlining leaves code brotli packs slightly worse; the
# following `-Os` pass recovers that, so the pair takes the raw saving at no
# wire cost. No measurable speed change (keccak / ABI decode / Safe address /
# P-256 recovery / i18n / a Crux dispatch, CPU time). Size optimisation only:
# no pass that assumes traps never happen (`-tnh`) or that low memory is
# unused, so the module behaves exactly as before. Features come from the
# module's own `target_features` section.
#
# rustc's `opt-level` stays the workspace's "z". Against it (same source,
# `-Os` here): "s" builds 9,781,884 raw / 2,094,292 br (+25% / +14%) and "3"
# 14,179,296 raw (over the 8 MB gate), for hot calls ~30% faster in CPU time —
# microseconds per call (a Crux dispatch 38 -> 25 µs, keccak 20 -> 14 µs,
# P-256 recovery 6.3 -> 5.4 ms) — against 257 KB more on every cold load.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-Os"]
