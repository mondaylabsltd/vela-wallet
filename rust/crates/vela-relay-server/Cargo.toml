[package]
name = "vela-relay-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Clear Signer relay (vela-relay/1) as a native server: tokio + hyper + tungstenite, rooms in memory. Runs under Docker."
publish = false

# Kept lean on purpose: hyper's bare HTTP/1 server (no axum/tower) and
# tungstenite without its client or TLS halves — TLS is the proxy's job.
[dependencies]
vela-relay = { path = "../vela-relay" }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util"] }
