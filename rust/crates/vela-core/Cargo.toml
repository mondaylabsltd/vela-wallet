[package]
name = "vela-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Vela Wallet shared computation core: pure, correctness-critical parsing/encoding/hashing/assembly. No I/O, no FFI deps."

[lib]
crate-type = ["lib"]

# Per-locale translation catalogs (spec 004-rust-i18n, FR-014).
#
# The DEFAULT is deliberately ZERO locales: the engine plus the shared path table
# only. Measured — engine alone is +4,849 wasm bytes, but all 15 catalogs compiled
# in come to 1,315,023, which is 315,023 OVER the MAX_WASM_BYTES = 1_000_000 gate
# at rust/scripts/build-web.mjs:42. Web therefore fetches per-locale JSON at
# runtime (Catalog::from_json), which is both smaller over the wire (176,852
# brotli'd bytes for all 15, against +235,476 for the best in-wasm variant) and the
# only shape that actually loads on demand.
#
# `i18n-all` exists for the conformance suite, which must have every locale
# resident to replay the 17,115-case exhaustive corpus. NEVER enable it for a
# wasm32-unknown-unknown build.
[features]
default = []

# Portable state machines (spec 011-crux-onboarding-state, 016/017, 019).
#
# DEFAULT OFF so a consumer that does not run a machine does not pay for one —
# `crux_core`, `futures` and their trees stay out of its dependency graph
# entirely.
#
# The rule this replaces (spec 019-onboarding-live-wiring, research D2). Until
# 019 this feature carried a hard invariant:
#
#   cargo tree -p vela-core-uniffi | grep -c crux   # must be 0
#
# with the reason "web is the only runtime that can execute it (Hermes has no
# WebAssembly)". That was true of the RUNTIME it was written about: the Expo
# React Native client, whose JavaScript engine cannot load wasm and therefore
# could not have run the machines at all. It stopped describing reality when
# `app-ios` and `app-android` became native Swift and Kotlin — they have no
# Hermes, no wasm, and reach Rust only through uniffi. Holding the old rule
# would not have kept anything safe; it would have forced the two native
# clients to re-implement the onboarding rules by hand, which is precisely the
# duplication this crate exists to prevent.
#
# What replaced it is a MEASUREMENT, not a prohibition. `crux` is on for
# `vela-core-uniffi`, and the price is recorded rather than assumed:
# +785,864 bytes stripped on arm64-v8a (2,369,528 → 3,155,392), the figure in
# specs/019-onboarding-live-wiring/results.md T098. That number is the gate — a
# future change that moves it materially is a decision to take again, not a
# diff to wave through.
#
# Still true, and still worth verifying:
#   cargo tree -p vela-core-wasm | grep -c crux     # must be > 0
crux = ["dep:crux_core"]

# PNG rasterization of the circular identicon (spec 015-wallet-home-ui,
# research.md D1). DEFAULT OFF for the same reason as `crux`: with the feature
# off, resvg is not in the dependency graph, so the wasm build cannot grow.
# Enabled by vela-core-uniffi (Android/iOS decode the PNG natively) and by
# app-desktop (decodes via the `image` crate into a gpui RenderImage).
identicon-raster = ["dep:resvg"]

# The parallel space's fixed keyset (spec 032-desktop-money-wiring, US0): a
# software P-256 signer whose assertions and registrations are byte-for-byte
# what a real authenticator emits. DEFAULT OFF, and it must stay off for
# `vela-core-uniffi` and `vela-core-wasm`: a production binary carries neither
# the test scalars nor any path to a software signer. Only a client that also
# gates the space at RUNTIME (an explicit switch plus an unconditional badge)
# turns it on, and only in its own build. No extra dependency — the signer is
# the same `p256` the registry group proof already uses.
dev-fixtures = []

# TypeScript mirrors of the wire types, emitted by
# `src/bin/generate_onboarding_bindings.rs`. Build-time only.
bindings = ["dep:ts-rs", "crux"]

i18n-en = []
i18n-zh = []
i18n-zh-tw = []
i18n-zh-hk = []
i18n-ja = []
i18n-ko = []
i18n-vi = []
i18n-id = []
i18n-tr = []
i18n-ru = []
i18n-es-mx = []
i18n-pt-br = []
i18n-fr = []
i18n-de = []
i18n-it = []
i18n-all = [
  "i18n-en", "i18n-zh", "i18n-zh-tw", "i18n-zh-hk", "i18n-ja", "i18n-ko",
  "i18n-vi", "i18n-id", "i18n-tr", "i18n-ru", "i18n-es-mx", "i18n-pt-br",
  "i18n-fr", "i18n-de", "i18n-it",
]

[dependencies]
alloy-primitives = { workspace = true }
alloy-dyn-abi = { workspace = true }
alloy-json-abi = { workspace = true }
sha2 = { workspace = true }
# `ecdh` for the CTAP2 PIN/UV key agreement in `ctap::ceremony` — the ephemeral
# scalar's randomness still comes from the shell, through the `Host` seam.
p256 = { workspace = true, features = ["ecdh"] }
ecdsa = { workspace = true }
ciborium = { workspace = true }
# CTAP2 PIN/UV auth protocols One and Two — the only place this crate encrypts
# anything. Everything else it does is hashing, parsing and assembly.
hkdf = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { workspace = true }
ciborium-io = { workspace = true }
coset = { workspace = true }
base64 = { workspace = true }
ryu-js = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crux_core = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

[[bin]]
name = "generate_onboarding_bindings"
path = "src/bin/generate_onboarding_bindings.rs"
required-features = ["bindings"]

[[bin]]
name = "generate_wallet_state_bindings"
path = "src/bin/generate_wallet_state_bindings.rs"
required-features = ["bindings"]

[[bin]]
name = "generate_session_bindings"
path = "src/bin/generate_session_bindings.rs"
required-features = ["bindings"]

[dev-dependencies]
proptest = { workspace = true }
hex-literal = { workspace = true }
# deterministic RFC-6979 signing inside recovery proptests only — never a prod dependency
p256 = { workspace = true, features = ["ecdsa", "alloc"] }
