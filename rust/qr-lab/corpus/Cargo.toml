[package]
name = "qr-corpus"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The same encoder (and major) vela-core draws every code with.
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
