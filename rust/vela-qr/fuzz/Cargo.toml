[package]
name = "vela-qr-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vela-qr = { path = "..", features = ["probe"] }

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grid"
path = "fuzz_targets/grid.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false
